const expDays = () => +(S.settings.expiryDays ?? 7) || 7;
function expState(d) { if (!d) return null; const n = dayDiff(todayStr(), d); return { n, k: n < 0 ? 'expired' : n <= expDays() ? 'soon' : 'ok' }; }
const expText = s => !s ? 'not set' : s.k === 'expired' ? `expired ${-s.n} day${s.n === -1 ? '' : 's'} ago` : s.n === 0 ? 'expires today' : `in ${s.n} day${s.n === 1 ? '' : 's'}`;
function expiryItems() {
  const out = [];
  S.cars.filter(c => c.active !== false && !isSub(c)).forEach(c => [['Registration', c.regExpiry], ['Insurance', c.insExpiry]].forEach(([what, d]) => { const s = expState(d); if (s && s.k !== 'ok') out.push({ c, what, d, s }); }));
  return out.sort((a, b) => a.s.n - b.s.n);
}
function expChip(c) { const w = [expState(c.regExpiry), expState(c.insExpiry)].filter(s => s && s.k !== 'ok'); if (!w.length) return ''; return w.some(s => s.k === 'expired') ? '<span class="chip late">Papers expired</span>' : '<span class="chip soon">Papers due</span>'; }
const canRenew = () => role() === 'admin' || role() === 'sales';
function expRow(x) { return `<div class="alert-row exp-row ${x.s.k === 'expired' ? 'late' : ''}"><a href="#/car/${x.c.id}" class="exp-link"><strong>${esc(x.c.plate)}, ${esc(carTitle(x.c))}</strong><span>${x.what} ${esc(fmtDate(x.d))}: <b>${esc(expText(x.s))}</b>${x.what === 'Insurance' && x.c.insurer ? `, ${esc(x.c.insurer)}` : ''}</span></a>${canRenew() ? `<button class="btn sm primary" data-act="renew" data-car="${x.c.id}" data-what="${x.what}">Renew</button>` : ''}</div>`; }
const expWhoOk = () => { const w = S.settings.expiryWho || 'staff'; return w === 'all' || (w === 'admin' ? isAdmin() : role() === 'admin' || role() === 'sales'); };
function checkExpiryPopup() {
  if (!S.me || !expWhoOk() || $('#overlay') || S.formOpen) return;
  const t = todayStr(), at = S.settings.expiryTime || '12:00';
  let ack = ''; try { ack = localStorage.getItem('tb-exp-ack') || ''; } catch (e) { }
  if (ack === t || tOf(nowLocal()) < at) return;
  const items = expiryItems(); if (!items.length) return;
  if (typeof phoneNotify === 'function') phoneNotify('Registration and insurance', `${items.length} item${items.length === 1 ? '' : 's'} due or expired`, 'expiry-' + t);
  showExpirySheet();
}
function showExpirySheet() {
  const t = todayStr(), items = expiryItems();
  if (!items.length) { closeSheet(); try { localStorage.setItem('tb-exp-ack', t); } catch (e) { } toast('All renewals are up to date.'); return; }
  S.expSheet = true;
  const o = openSheet(`<h2>Registration and insurance</h2><p class="muted" style="margin:4px 0 0">${items.length} renewal${items.length === 1 ? '' : 's'} need attention. Tap a car to open it.</p>
    ${items.map(expRow).join('')}
    <div class="btnrow"><button class="btn primary" id="exp-ok">OK, got it</button><a class="btn" href="#/expiry" id="exp-all">See all dates</a></div>`);
  const ack1 = () => { S.expSheet = false; try { localStorage.setItem('tb-exp-ack', t); } catch (e) { } };
  o.querySelector('#exp-ok').onclick = () => { ack1(); closeSheet(); };
  o.querySelectorAll('a').forEach(a => a.addEventListener('click', ack1));
  o.addEventListener('click', ev => { if (ev.target === o) ack1(); });
}
function viewExpiry() {
  const f = S.expF || 'due';
  const cars = S.cars.filter(c => c.active !== false && !isSub(c)).map(c => ({ c, r: expState(c.regExpiry), i: expState(c.insExpiry) }));
  const rank = x => Math.min(x.r ? x.r.n : 9999, x.i ? x.i.n : 9999);
  const list = cars.filter(x => f === 'all' ? true : f === 'missing' ? !x.r || !x.i : [x.r, x.i].some(s => s && s.k !== 'ok')).sort((a, b) => rank(a) - rank(b));
  const cell = (label, s, d) => `<span class="exp-cell ${s ? s.k : 'none'}">${label}: <strong>${d ? esc(fmtDate(d)) : 'not set'}</strong>${s && s.k !== 'ok' ? ` <em>${esc(expText(s))}</em>` : ''}</span>`;
  const html = `<p class="small muted" style="margin:4px 0 10px">Own and investor cars. Reminders start ${expDays()} days before expiry${isAdmin() ? '. Change this and the reminder time in Company and VAT settings' : ''}.</p>
    <div class="seg left" role="group" aria-label="Show">${[['due', `Due or expired ${cars.filter(x => [x.r, x.i].some(s => s && s.k !== 'ok')).length}`], ['missing', `Dates missing ${cars.filter(x => !x.r || !x.i).length}`], ['all', `All ${cars.length}`]].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="expf" data-f="${k}">${l}</button>`).join('')}</div>
    ${list.length ? list.map(x => `<div class="list-row"><div class="lr-top"><span><span class="plate big">${esc(x.c.plate)}</span> <strong>${esc(carTitle(x.c))}</strong></span>${expChip(x.c)}</div>
      <div class="exp-cells">${cell('Registration', x.r, x.c.regExpiry)}${cell('Insurance', x.i, x.c.insExpiry)}</div>
      ${x.c.insurer || x.c.policyNo ? `<div class="lr-sub">${esc([x.c.insurer, x.c.policyNo ? 'Policy ' + x.c.policyNo : ''].filter(Boolean).join(', '))}</div>` : ''}
      <div class="t-actions">${canRenew() ? `<button class="btn sm ${x.r && x.r.k !== 'ok' ? 'primary' : ''}" data-act="renew" data-car="${x.c.id}" data-what="Registration">Renew registration</button><button class="btn sm ${x.i && x.i.k !== 'ok' ? 'primary' : ''}" data-act="renew" data-car="${x.c.id}" data-what="Insurance">Renew insurance</button>` : ''}<a class="btn sm" href="#/car/${x.c.id}">Car history</a></div></div>`).join('')
      : `<div class="empty"><h3>${f === 'due' ? 'Nothing due in the next ' + expDays() + ' days' : f === 'missing' ? 'All cars have both dates' : 'No cars yet'}</h3></div>`}`;
  return { title: 'Registration and insurance', back: '#/more', html };
}
ACT.expf = ({ f }) => { S.expF = f; render(); };


/* Renew: new expiry pre-filled one year after the old one */
ACT.renew = ({ car, what }) => {
  if (!canRenew()) return;
  const c = S.cars.find(x => x.id === car); if (!c) return;
  const ins = what === 'Insurance', old = ins ? c.insExpiry : c.regExpiry;
  const base = old && old > addDays(todayStr(), -60) ? old : todayStr();
  const fromPopup = !!S.expSheet;
  const o = openSheet(`<h2>Renew ${ins ? 'insurance' : 'registration'}</h2>
    <p style="margin:4px 0 0"><span class="plate big">${esc(c.plate)}</span> ${esc(carTitle(c))}<br><span class="muted">Current expiry: <strong>${old ? esc(fmtDate(old)) : 'not set'}</strong>${old ? ` (${esc(expText(expState(old)))})` : ''}</span></p>
    <label class="f">New expiry date<input type="date" id="rn-date" value="${addMonths(base, 12)}"></label>
    <div class="seg left" role="group" aria-label="Period" style="margin:8px 0 0">${[[6, '6 months'], [12, '1 year'], [13, '13 months'], [24, '2 years']].map(([n, l]) => `<button type="button" data-rn="${addMonths(base, n)}" class="${n === 12 ? 'on' : ''}">+ ${l}</button>`).join('')}</div>
    ${ins ? `<div class="grid2"><label class="f">Insurance company<input id="rn-co" value="${esc(c.insurer || '')}"></label><label class="f">Policy no.<input id="rn-pol" value="${esc(c.policyNo || '')}"></label></div>` : ''}
    <p class="err" id="rn-err"></p>
    <div class="btnrow"><button class="btn" id="rn-back">Go back</button><button class="btn primary" id="rn-save">Save renewal</button></div>`);
  o.querySelectorAll('[data-rn]').forEach(bt => bt.onclick = () => { o.querySelector('#rn-date').value = bt.dataset.rn; o.querySelectorAll('[data-rn]').forEach(x => x.classList.toggle('on', x === bt)); });
  o.querySelector('#rn-back').onclick = () => { if (fromPopup) showExpirySheet(); else closeSheet(); };
  o.querySelector('#rn-save').onclick = async ev => {
    const nd = o.querySelector('#rn-date').value;
    if (!nd) { $('#rn-err').textContent = 'Choose the new expiry date.'; return; }
    if (old && nd <= old) { $('#rn-err').textContent = 'The new date must be after the current expiry.'; return; }
    ev.target.disabled = true;
    const d = ins ? { insExpiry: nd, insurer: o.querySelector('#rn-co').value.trim(), policyNo: o.querySelector('#rn-pol').value.trim() } : { regExpiry: nd };
    d.renewals = FV.arrayUnion({ what, from: old || '', to: nd, at: nowLocal(), by: S.me.name });
    try {
      await db.doc('cars/' + car).update(d);
      Object.assign(c, ins ? { insExpiry: nd, insurer: d.insurer, policyNo: d.policyNo } : { regExpiry: nd });
      toast(`${c.plate}: ${ins ? 'insurance' : 'registration'} renewed to ${fmtDate(nd)}.`);
      if (fromPopup) showExpirySheet(); else { closeSheet(); if (S.route === 'car') S.hist = null; render(); }
    } catch (e) { ev.target.disabled = false; $('#rn-err').textContent = friendlyError(e); }
  };
};

boot();

</script>
</body>
</html>
