<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thomson Booking</title>
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thomson Booking">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#112038;--navy:#13294B;--navy-2:#21456F;--night:#0C1C33;--amber:#E8A33D;--paper:#EDF1F5;--card:#FFFFFF;--line:#DCE2E9;--line-2:#C5CFDA;--muted:#5A6A7B;
  --deliv:#1F6FD1;--deliv-bg:#E6EFFA;--pick:#9A5800;--pick-bg:#FCEFD8;--done:#2B7A4B;--done-bg:#E1F1E7;--late:#B92F26;--late-bg:#FBE7E5;
  --head:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;--body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--deliv)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
.main{max-width:760px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
:focus-visible{outline:3px solid #7FB0EA;outline-offset:2px}

/* top bars */
.topbar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back svg{width:26px;height:26px}
.topbar .back{color:#fff;text-decoration:none;font-size:15px;display:flex;align-items:center;gap:4px;min-height:40px}
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.hero .logo{height:52px;width:auto;max-width:150px;background:#fff;border-radius:var(--r-sm);padding:4px}
.wordmark{display:flex;flex-direction:column;line-height:1;background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:8px 10px}
.wm-1{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.02em}
.wm-2{font-size:11px;margin-top:3px;color:var(--navy-2)}
.hero .welcome{font-size:15px;line-height:1.35}
.hero .who{font-size:13px;opacity:.8;margin-top:2px}

/* date bar */
.datebar{max-width:760px;margin:0 auto;padding:18px 16px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.bigdate{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.01em;text-align:center}
.datebar .sub{text-align:center;margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

/* strips */
.strip{border-radius:var(--r);padding:12px 14px;margin:12px 0}
.strip h3{font-size:15px;margin-bottom:6px}
.strip.late{background:var(--late-bg);border:1px solid #F1B8B2;color:#7A1C16}
.strip.info{background:var(--deliv-bg);border:1px solid #B9D1F0;color:#123E73}
.strip a.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);text-decoration:none;color:inherit;font-size:14px}
.strip a.row:first-of-type{border-top:0}

/* timeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.timeline{list-style:none;margin:8px 0 0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:71px;top:6px;bottom:6px;width:2px;background:var(--line)}
.task{display:grid;grid-template-columns:58px 1fr;column-gap:26px;position:relative;padding:6px 0}
.task::before{content:"";position:absolute;left:66px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--deliv);box-shadow:0 0 0 3px var(--paper)}
.task.pickup::before{background:#D08A1C}
.task.done::before{background:var(--done)}
.task.late::before{background:var(--late)}
.t-time{font-family:var(--head);font-weight:800;font-size:17px;text-align:right;padding-top:14px;line-height:1.1}
.t-time small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.t-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.task.done .t-card{background:#F7FBF8;border-color:#CBE5D4}
.task.late .t-card{border-color:#E9A39C;background:#FFF8F7}
.task.soon .t-card{border-color:#E4A94A;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,169,74,.0)}50%{box-shadow:0 0 0 6px rgba(228,169,74,.35)}}
@media (prefers-reduced-motion:reduce){.task.soon .t-card{animation:none;box-shadow:0 0 0 4px rgba(228,169,74,.35)}}
.t-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.t-car{font-weight:700;font-size:16px}
.plate{display:inline-block;border:1.5px solid var(--ink);border-radius:5px;padding:0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;margin-left:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.t-meta{font-size:14px;color:var(--muted);margin-top:2px}
.t-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EDF0F4;color:#34465A;white-space:nowrap}
.chip.delivery{background:var(--deliv-bg);color:#154C8E}
.chip.pickup{background:var(--pick-bg);color:#7A4500}
.chip.done,.chip.closed{background:var(--done-bg);color:#1F5E39}
.chip.late,.chip.cancelled{background:var(--late-bg);color:#8E231C}
.chip.soon{background:#FFE7BF;color:#7A4500}
.chip.mine{background:var(--navy);color:#fff}
.chip.booked{background:var(--deliv-bg);color:#154C8E}
.chip.onrent{background:#E8E4F8;color:#3E2F8A}
.chip.returned,.chip.pending{background:var(--pick-bg);color:#7A4500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:15px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.danger{color:var(--late);border-color:#E9A39C}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 auto}

/* cards, sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .big{font-family:var(--head);font-weight:800;font-size:18px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}
.list-row{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;text-decoration:none;color:inherit}
.list-row .lr-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list-row .lr-sub{font-size:14px;color:var(--muted);margin-top:3px}
.list-row .lr-when{font-weight:700;margin-top:4px}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;cursor:pointer;text-align:left}
.menu{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0}
.menu :last-child{border-bottom:0}

/* forms */
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 0}
label.f>input,label.f>select,label.f>textarea,.f-in{display:block;width:100%;margin-top:5px;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;color:var(--ink);font-size:16px}
label.f>textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.grid2>*{min-width:0}
label.f>input{min-width:0;-webkit-appearance:none;appearance:none}
label.f>input[type=date],label.f>input[type=time]{-webkit-appearance:none;appearance:none}
.err{color:var(--late);font-size:14px;margin:8px 0 0;min-height:1em}
.warn{background:var(--pick-bg);border:1px solid #EFC98A;color:#6B3D00;border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-top:12px}
.calc{background:#F6F8FB;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;margin-top:14px;font-size:15px}
.calc .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.calc .r.t{font-weight:700;border-top:1px solid var(--line-2);margin-top:6px;padding-top:6px}
.calc .r.g{font-family:var(--head);font-weight:800;font-size:19px}
.pill-choice{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill-choice label{flex:1 1 0;min-width:90px}
.pill-choice input{position:absolute;opacity:0;pointer-events:none}
.pill-choice span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 8px;background:#fff;cursor:pointer;color:var(--ink);font-size:15px}
.pill-choice input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.pill-choice input:focus-visible+span{outline:3px solid #7FB0EA}
.line{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) 102px 26px;gap:6px;align-items:center;margin-top:8px}
.line input,.line select{min-height:42px;padding:8px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;width:100%;font-size:15px;min-width:0}
.line .x{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.line .lock{font-size:13px;color:var(--muted);padding-left:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 0;min-height:48px}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--navy);font-weight:700}
.nav a.add span.plus{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:-4px}
.nav a.add svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:4px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:var(--r-sm);font-size:15px}
.toast.alert{background:#7A4500}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth-card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:400px}
.auth-card .wordmark{background:var(--paper);display:inline-flex}
.auth-card .logo{height:56px;width:auto}
.auth-card h1{font-size:22px;margin:16px 0 4px}

/* tables on screen */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}


/* ===== visual layer v2 ===== */
h1,h2,h3,.bigdate,.stat strong,.t-time{font-stretch:112%}
body{background:var(--paper)}
.topbar{background:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.topbar h1{font-stretch:112%}

.hero{position:relative;overflow:hidden;background:var(--navy);padding:calc(16px + env(safe-area-inset-top)) 16px 64px}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;pointer-events:none}
.hero-in{position:relative;display:block;max-width:760px;margin:0 auto}
.hero-top{display:flex;align-items:center;gap:14px}
.hero .welcome{font-size:15px;line-height:1.35;font-weight:600}
.hero .who{font-size:13px;opacity:.75;margin-top:2px}
.hero-date{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:22px}
.hero .bigdate{color:#fff;font-size:clamp(26px,7.4vw,40px);line-height:1.08;text-align:center;letter-spacing:-.01em}
.hero .seg{margin-bottom:10px}
.hero .seg button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.hero .seg button.on{background:var(--amber);border-color:var(--amber);color:var(--night);font-weight:700}
.iconbtn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}

.stats{position:relative;z-index:2;max-width:760px;margin:-42px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;background:#fff;border-radius:14px;padding:12px 14px 11px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(12,28,51,.08),0 6px 18px rgba(12,28,51,.07);border-top:4px solid var(--c)}
.stat strong{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.05;color:var(--c)}
.stat strong small{font-size:15px;color:var(--muted);font-weight:600}
.stat span{font-size:13.5px;font-weight:600;margin-top:2px}
.stat em{font-style:normal;font-size:12.5px;color:var(--muted)}
.s-d{--c:var(--deliv)}.s-p{--c:#B86E06}.s-r{--c:#5B3FB0}.s-f{--c:var(--done)}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.sec-head h2{font-size:18px}
.sec-head .toolbar{margin:0}

.t-card{box-shadow:inset 4px 0 0 var(--deliv),0 1px 2px rgba(12,28,51,.05);border-radius:12px}
.task.pickup .t-card{box-shadow:inset 4px 0 0 #D8912A,0 1px 2px rgba(12,28,51,.05)}
.task.done .t-card{box-shadow:inset 4px 0 0 var(--done)}
.task.late .t-card{box-shadow:inset 4px 0 0 var(--late)}
.t-car{display:flex;align-items:center;gap:10px}
.t-car>span{flex:1;min-width:0}
.car-ico{width:42px;height:20px;flex:none;fill:var(--deliv)}
.car-ico .w{fill:var(--night);stroke:#fff;stroke-width:2}
.car-ico .g{fill:#fff;opacity:.55}
.task.pickup .car-ico{fill:#D8912A}
.task.done .car-ico{fill:var(--done)}
.task.late .car-ico{fill:var(--late)}
.car-ico.big{width:110px;height:52px;fill:#B9C5D3;margin:0 auto 10px;display:block}

.plate{background:#fff;border:1.5px solid #1A1A1A;border-radius:5px;box-shadow:inset 3px 0 0 #C8372D;padding:0 6px 0 9px}

.cat-h{display:flex;align-items:center;gap:8px;font-size:16px;margin:18px 0 8px}
.cat-h .dot{width:10px;height:10px;border-radius:50%}
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.car-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;font:inherit;color:var(--ink);cursor:pointer;width:100%}
div.car-tile{cursor:default}
.car-tile .car-ico{width:64px;height:30px;fill:var(--cc);margin-bottom:4px}
.car-tile .ct-name{font-weight:700;font-size:15px;line-height:1.25}
.car-tile .ct-sub{font-size:13px;color:var(--muted)}
.car-tile .sno{position:absolute;top:8px;right:10px;font-size:12px;color:var(--muted)}
.car-tile.off{opacity:.6}
button.car-tile:active{transform:scale(.98)}

.card,.list-row{border-radius:14px}
.btn.primary{box-shadow:0 2px 6px rgba(19,41,75,.25)}
.nav a.add span.plus{background:var(--amber);color:var(--night);box-shadow:0 3px 10px rgba(232,163,61,.45)}
.nav a.on{color:var(--navy)}

.auth{position:relative;overflow:hidden;background:var(--navy)}
.auth .skyline{height:220px}
.auth-card{position:relative;z-index:1;box-shadow:0 20px 50px rgba(0,0,0,.3)}


/* ===== v3: board, availability, calendar, sub-lease ===== */
.main.wide{max-width:1240px}
.hero.home .hero-in{max-width:1240px}
.stats.wide{max-width:1240px}
button.stat{font:inherit;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
a.car-tile{text-decoration:none}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 88px;gap:0 10px}
.grid3>*{min-width:0}
.hire{background:#FFF8EC;border:1px solid #EFC98A;border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.hire h3{font-size:15px;margin:10px 0 0;color:#6B3D00}
.late-warn{background:var(--late-bg);border-color:#E9A39C;color:#7A1C16}
.chip.sub{background:#F3E8FF;color:#5B2C91}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.seg.left{justify-content:flex-start;flex-wrap:wrap;margin:10px 0 0}
.seg.wrap{flex-wrap:wrap}

.sec-head{align-items:flex-end}
.tabs-m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.tabs-m button{border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:6px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:48px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs-m button span{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:#E6EBF1;font-size:12px;font-weight:700}
.tabs-m button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs-m button.on span{background:var(--amber);color:var(--night)}
.board{margin-top:8px}
.board .col{display:none}
.board.tab-all .col-all,.board.tab-d .col-d,.board.tab-p .col-p,.board.tab-a .col-a{display:block}
.col-h{display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0;padding:10px 14px;color:#fff}

<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* Your Firebase keys and logo live in config.js, so this file can be replaced freely. */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || { apiKey: 'PASTE_API_KEY' }; // set in config.js
const LOGO_URL = window.LOGO_URL || '';                                          // set in config.js
const COMPANY = 'Thomson Rent A Car LLC';
const EMAIL_DOMAIN = 'thomson-booking.app'; // internal only: usernames become username@this-domain

/* ========================================================= helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localStr = d => `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => dstr(new Date());
const nowLocal = () => localStr(new Date());
const parseDT = s => { if (!s) return null; const [a, b = '00:00'] = s.split('T'); const [y, m, d] = a.split('-').map(Number); const [h, mi] = b.split(':').map(Number); return new Date(y, m - 1, d, h || 0, mi || 0); };
const addDays = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const dayDiff = (a, b) => Math.round((parseDT(b + 'T12:00') - parseDT(a + 'T12:00')) / 864e5);
const fmtLong = ds => parseDT(ds + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDate = ds => ds ? parseDT(ds.slice(0, 10) + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDay = ds => ds ? parseDT(ds.slice(0, 10) + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const time12 = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const tOf = s => s ? s.slice(11, 16) : '';
const fmtDT = s => s ? `${fmtDate(s)}, ${time12(tOf(s))}` : '';
const money = n => (Math.round(((+n || 0) + Number.EPSILON) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const durText = ms => { const m = Math.max(1, Math.round(Math.abs(ms) / 60000)); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), mm = m % 60; if (h < 48) return mm ? `${h} h ${mm} min` : `${h} h`; return `${Math.round(h / 24)} days`; };
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  car: '<path d="M3.5 13.5 5.5 7h13l2 6.5V18h-17z M3.5 13.5h17 M7 16h.01 M17 16h.01 M6 18v2 M18 18v2"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>',
  cal: '<path d="M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z M4 10h16 M8.5 3v4 M15.5 3v4 M8 14h3"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const STATUS = { booked: 'Booked', onrent: 'On rent', returned: 'Returned, to settle', pending: 'Pending charges', closed: 'Closed', cancelled: 'Cancelled' };
const ACTIVE = ['booked', 'onrent', 'returned', 'pending'];
const MODE_LABEL = { plus: '+VAT', incl: 'Incl. VAT', none: 'No VAT' };
const FUEL = ['Empty', '1/4', '1/2', '3/4', 'Full'];

/* ========================================================= VAT & totals */
const vatRate = () => ((S.settings.vatRate ?? 5) / 100);
function lineCalc(amount, mode, v = vatRate()) {
  amount = +amount || 0;
  if (mode === 'plus') { const vat = r2(amount * v); return { net: r2(amount), vat, gross: r2(amount + vat) }; }
  if (mode === 'incl') { const net = r2(amount / (1 + v)); return { net, vat: r2(amount - net), gross: r2(amount) }; }
  return { net: r2(amount), vat: 0, gross: r2(amount) };
}
function calcSettlement(s, v = vatRate()) {
  const rows = [];
  if (s.rateType === 'month') rows.push({ label: `Rent, monthly contract (${+s.rentDays || 0} days)`, mode: s.vatMode, ...lineCalc(+s.rentAmount || 0, s.vatMode, v) });
  else rows.push({ label: `Rent ${+s.rentDays || 0} day${+s.rentDays === 1 ? '' : 's'} × ${money(s.rate)}`, mode: s.vatMode, ...lineCalc((+s.rentDays || 0) * (+s.rate || 0), s.vatMode, v) });
  (s.lines || []).forEach(l => { if (+l.amount) rows.push({ label: l.label || 'Other', mode: l.mode, ...lineCalc(l.amount, l.mode, v) }); });
  if (+s.fines) rows.push({ label: 'Traffic fines', mode: 'none', ...lineCalc(s.fines, 'none', v) });
  const taxable = r2(rows.filter(r => r.mode !== 'none').reduce((a, r) => a + r.net, 0));
  const vat = r2(rows.reduce((a, r) => a + r.vat, 0));
  const nonTaxable = r2(rows.filter(r => r.mode === 'none').reduce((a, r) => a + r.gross, 0));
  const subtotal = r2(rows.reduce((a, r) => a + r.gross, 0));
  const cc = s.method === 'card' ? r2(subtotal * (+s.ccPct || 0) / 100) : 0;
  const ccVat = r2(cc * v);
  const total = r2(subtotal + cc + ccVat);
  const advance = r2(s.advance);
  return { rows, taxable, vat, nonTaxable, subtotal, cc, ccVat, total, advance, balance: r2(total - advance) };
}
const estimate = (b, f) => lineCalc(f.rateType === 'month' ? r2((+f.rate || 0) / 30 * (+b.days || 0)) : (+b.days || 0) * (+f.rate || 0), f.vatMode);
const rateText = f => `AED ${money(f.rate)} per ${f.rateType === 'month' ? 'month' : 'day'}`;
const bookingTotal = (b, f) => !f ? 0 : (f.settlement && f.settlement.totals ? f.settlement.totals.total : estimate(b, f).gross);

const ACT = {};
/* ========================================================= state */
const S = {
  me: null, settings: {}, cars: [], sales: [], users: [],
  active: new Map(), day: new Map(), cache: new Map(), fin: new Map(),
  viewDate: todayStr(), unsub: [], dayUnsub: [], detailId: null, detailUnsub: [],
  formOpen: false, route: 'home', availMode: 'own', calStart: null, calRows: null, filter: null, listRows: null, listFin: new Map(), settingUp: false
};
try { S.homeTab = localStorage.getItem('tb-tab') || 'all'; } catch (e) { S.homeTab = 'all'; }
try { S.notified = new Set(JSON.parse(localStorage.getItem('tb-notified') || '[]')); } catch (e) { S.notified = new Set(); }
const role = () => S.me && S.me.role;
const isAdmin = () => role() === 'admin';
const isStaff = () => role() === 'admin' || role() === 'sales';
const getB = id => S.active.get(id) || S.day.get(id) || S.cache.get(id);
const drivers = () => S.users.filter(u => u.role === 'driver' && u.active !== false);

/* ========================================================= firebase */
const configured = !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE');
let auth, db, FV;
if (configured) {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth(); db = firebase.firestore(); FV = firebase.firestore.FieldValue;
}
const emailOf = u => `${String(u).trim().toLowerCase()}@${EMAIL_DOMAIN}`;
function friendlyError(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Username or password is incorrect.';
  if (/email-already-in-use/.test(c)) return 'That username is already taken. Try another.';
  if (/weak-password/.test(c)) return 'Password must be at least 6 characters.';
  if (/too-many-requests/.test(c)) return 'Too many attempts. Wait a few minutes and try again.';
  if (/permission-denied/.test(c)) return "You don't have permission for this.";
  if (/unavailable|network/.test(c)) return 'No connection. Check your internet and try again.';
  if (/requires-recent-login/.test(c)) return 'Sign out and sign in again, then retry.';
  return (e && e.message) || 'Something went wrong. Try again.';
}

function boot() {
  if (!configured) { document.body.classList.add('no-nav'); $('#app').innerHTML = viewNotConfigured(); return; }
  auth.onAuthStateChanged(u => { if (!S.settingUp) handleAuth(u); });
  window.addEventListener('hashchange', () => { closeSheet(); S.formOpen = false; render(); window.scrollTo(0, 0); });
  document.addEventListener('click', onClick);
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  setInterval(tick, 30000);
}
async function handleAuth(u) {
  stopAll();
  S.me = null;
  if (!u) {
    document.body.classList.add('no-nav');
    let setupDone = true;
    try { const s = await db.doc('meta/setup').get(); setupDone = s.exists; } catch (e) { setupDone = true; }
    $('#app').innerHTML = setupDone ? viewLogin() : viewSetup();
    setupDone ? mountLogin() : mountSetup();
    return;
  }
  let snap;
  try { snap = await db.doc('users/' + u.uid).get(); } catch (e) { snap = null; }
  if (!snap || !snap.exists || snap.data().active === false) {
    document.body.classList.add('no-nav');
    $('#app').innerHTML = `<div class="auth"><div class="auth-card">${brand()}<h1>Account not active</h1><p class="muted">Ask your admin to activate your account.</p><button class="btn primary block" data-act="signout">Sign out</button></div></div>`;
    return;
  }
  S.me = { id: u.uid, ...snap.data() };
  document.body.classList.remove('no-nav');
  startListeners();
  if (!location.hash || location.hash === '#') location.hash = '#/home';
  render();
}
function stopAll() {
  S.unsub.forEach(f => f()); S.unsub = [];
  S.dayUnsub.forEach(f => f()); S.dayUnsub = [];
  S.detailUnsub.forEach(f => f()); S.detailUnsub = []; S.detailId = null;
  S.active = new Map(); S.day = new Map(); S.cache = new Map(); S.fin = new Map();
}
function onErr(e) { console.error(e); toast(friendlyError(e)); }
function startListeners() {
  const L = S.unsub;
  L.push(db.collection('cars').onSnapshot(s => { S.cars = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => carTitle(a).localeCompare(carTitle(b)) || (a.plate || '').localeCompare(b.plate || '')); refresh(); }, onErr));
  L.push(db.collection('salespeople').onSnapshot(s => { S.sales = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '')); refresh(); }, onErr));
  L.push(db.collection('users').onSnapshot(s => { S.users = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '')); refresh(); }, onErr));
  L.push(db.doc('meta/settings').onSnapshot(d => { S.settings = d.exists ? d.data() : {}; refresh(); }, onErr));
  L.push(db.collection('bookings').where('status', 'in', ACTIVE).onSnapshot(s => { S.active = new Map(s.docs.map(d => [d.id, { id: d.id, ...d.data() }])); refresh(); tick(true); }, onErr));
  subscribeDay();
}
function subscribeDay() {
  S.dayUnsub.forEach(f => f()); S.dayUnsub = [];
  const D = S.viewDate, dd = new Map(), pp = new Map();
  const merge = () => { S.day = new Map([...dd, ...pp]); refresh(); };
  S.dayUnsub.push(db.collection('bookings').where('deliveryDate', '==', D).onSnapshot(s => { dd.clear(); s.docs.forEach(d => dd.set(d.id, { id: d.id, ...d.data() })); merge(); }, onErr));
  S.dayUnsub.push(db.collection('bookings').where('pickupDate', '==', D).onSnapshot(s => { pp.clear(); s.docs.forEach(d => pp.set(d.id, { id: d.id, ...d.data() })); merge(); }, onErr));
}
function ensureDetail(id) {
  if (S.detailId === id) return;
  S.detailUnsub.forEach(f => f()); S.detailUnsub = []; S.detailId = id;
  S.detailUnsub.push(db.doc('bookings/' + id).onSnapshot(d => { if (d.exists) S.cache.set(id, { id, ...d.data() }); else S.cache.set(id, { id, missing: true }); refresh(); }, onErr));
  if (isStaff()) S.detailUnsub.push(db.doc('finance/' + id).onSnapshot(d => { S.fin.set(id, d.exists ? d.data() : { rate: 0, vatMode: 'plus', advance: 0 }); refresh(); }, onErr));
}
async function getFinMany(ids) {
  const out = new Map();
  if (!isStaff()) return out;
  const idField = firebase.firestore.FieldPath.documentId();
  for (let i = 0; i < ids.length; i += 30) {
    const chunk = ids.slice(i, i + 30);
    if (!chunk.length) continue;
    const s = await db.collection('finance').where(idField, 'in', chunk).get();
    s.docs.forEach(d => out.set(d.id, d.data()));
  }
  return out;
}
let refreshQueued = false;
function refresh() {
  if (!S.me || S.formOpen || refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => { refreshQueued = false; if (!S.formOpen) render(); });
}

/* ========================================================= ui primitives */
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast' + (kind ? ' ' + kind : ''); el.setAttribute('role', 'status'); el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), kind === 'alert' ? 9000 : 3800);
}
function openSheet(html) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
  const f = o.querySelector('input,select,textarea'); if (f && window.innerWidth > 700) f.focus();
  return o;
}
function closeSheet() { const o = $('#overlay'); if (o) o.remove(); }
function ask({ title, text = '', ok = 'Confirm', input = null, danger = false }) {
  return new Promise(res => {

ACT.resched = ({ id, type }) => {

  const o = openSheet(`<h2>Reschedule ${type}</h2>
    <p class="muted">${carLabel(b)}, ${esc(b.clientName)}<br>Now: <strong>${esc(fmtDT(cur))}</strong></p>

    <label class="f">Reason (optional)<input id="r-why" list="r-reasons" placeholder="Client requested later time"><datalist id="r-reasons"><option>Client requested</option><option>Client not reachable</option><option>Client delayed</option><option>Car not ready</option><option>Driver delayed</option></datalist></label>

    const at = `${nd}T${nt}`;

    let text = `${type === 'delivery' ? 'Delivery' : 'Pickup'} moved from ${fmtDT(cur)} to ${fmtDT(at)}`;

      upd.deliveryAt = at; upd.deliveryDate = nd;

        closeSheet();

    <p class="small muted" style="margin:6px 0 0">Monthly contract at ${rateText(f)}, ${MODE_LABEL[vm]}. Enter the rent to charge for this period.</p>`
    : `<div class="grid2"><label class="f">Rent days<input id="s-days" type="number" inputmode="numeric" min="0" step="1" value="${esc(init.rentDays)}"></label>
    <label class="f">Daily rate (AED)<input id="s-rate" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(f.rate)}"></label></div>
    <p class="small muted" style="margin:6px 0 0">Booked for ${b.days} days, ${MODE_LABEL[vm]}. Add extension days here.</p>`}
  </section>
  <section class="card"><h2>Charges at return</h2>
    <div class="line small muted" style="margin-top:0"><span>Charge</span><span>Amount</span><span>VAT</span><span></span></div>
    <div id="s-lines">${init.lines.map(lineRow).join('')}</div>
    <button class="btn sm" id="s-add" type="button" style="margin-top:8px">Add charge</button>
    <div class="line" style="margin-top:12px"><span style="font-weight:600">Traffic fines</span><input id="s-fines" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(init.fines)}" placeholder="0" aria-label="Fines amount"><span class="lock">No VAT</span><span></span></div>
  </section>
  <section class="card"><h2>Payment</h2>
    <label class="f">Advance already paid (AED)<input id="s-adv" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(init.advance)}"></label>
    <div class="f" style="margin-top:12px;color:var(--muted);font-size:14px">Payment method</div>
    <div class="pill-choice" role="radiogroup" aria-label="Payment method">${[['cash', 'Cash'], ['card', 'Card'], ['bank', 'Bank transfer']].map(([k, l]) => `<label><input type="radio" name="s-pay" value="${k}" ${init.method === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    <div id="s-ccbox"><div class="f" style="margin-top:12px;color:var(--muted);font-size:14px">CC charges</div>
    <div class="pill-choice" role="radiogroup" aria-label="CC charges">${ccOpts.map(p => `<label><input type="radio" name="s-cc" value="${p}" ${+init.ccPct === p ? 'checked' : ''}><span>${p}%</span></label>`).join('')}</div></div>
    <label class="f">Notes<input id="s-notes" value="${esc(init.notes)}" placeholder="Salik for 24 Sep still to post"></label>
    <div class="calc" id="s-sum"></div>

  <p class="err" id="s-err" role="alert"></p>
  <div class="btnrow"><button class="btn" id="s-pending">Save, charges pending</button><button class="btn primary" id="s-close">Close booking</button></div>
  <div class="btnrow"><a class="btn" href="#/booking/${id}">Go back</a>${f.settlement ? `<button class="btn" data-act="bill" data-id="${id}">Final bill PDF</button>` : ''}</div>`;
  const mount = () => {
    const read = () => {
      const lines = $$('[data-line]').map(r => { const [l, a, m] = r.querySelectorAll('input,select'); return { label: l.value.trim(), amount: parseFloat(a.value) || 0, mode: m.value }; });
      const method = ($('input[name=s-pay]:checked') || {}).value || 'cash';
      const s = { rentDays: parseInt($('#s-days').value, 10) || 0, rate: parseFloat($('#s-rate').value) || 0, rateType: monthly ? 'month' : 'day', rentAmount: monthly ? (parseFloat($('#s-amt').value) || 0) : null, vatMode: vm, lines, fines: parseFloat($('#s-fines').value) || 0,

      const bad = s.lines.find(l => l.amount && !l.label);
      if (bad) { $('#s-err').textContent = 'Give every charge a name.'; return; }
      if (status === 'closed' && !(await ask({ title: `Close ${b.ref}?`, text: `Total AED ${money(totals.total)}${totals.advance ? `, balance due AED ${money(totals.balance)}` : ''}. You can still reopen it later.`, ok: 'Close booking' }))) return;
      btn.disabled = true;
      const settlement = { ...s, totals, settledAt: nowLocal(), settledBy: S.me.name };
      try {
        const batch = db.batch();
        batch.set(db.doc('finance/' + id), { rate: s.rate, settlement }, { merge: true });
        batch.update(db.doc('bookings/' + id), { status, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: status === 'closed' ? `Closed, total AED ${money(totals.total)}, paid by ${s.method}` : `Settlement saved, charges pending (AED ${money(totals.total)} so far)` }) });
        await batch.commit(); S.formOpen = false; toast(status === 'closed' ? 'Booking closed.' : 'Saved as pending charges.'); location.hash = '#/booking/' + id;
      } catch (e) { btn.disabled = false; $('#s-err').textContent = friendlyError(e); }
    };
    $('#s-pending').onclick = e => save('pending', e.target);
    $('#s-close').onclick = e => save('closed', e.target);
  };
  return { title: 'Settle return', back: '#/booking/' + id, html, mount, form: true };
}

/* ========================================================= bookings list (bulk) */
async function loadList() {
  const F = S.filter;
  const s = await db.collection('bookings').where('deliveryDate', '>=', F.from).where('deliveryDate', '<=', F.to).get();
  S.listRows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, c) => a.deliveryAt.localeCompare(c.deliveryAt));
  S.listFin = await getFinMany(S.listRows.map(r => r.id));
}
function refCandidates(q) {
  const m = String(q || '').trim().toUpperCase().replace(/\s/g, '').match(/^(?:BK-?)?(?:(\d{4})-)?(\d{1,4})$/);
  if (!m) return [];
  const n = m[2].padStart(4, '0'), y = new Date().getFullYear();
  return m[1] ? [`BK-${m[1]}-${n}`] : [`BK-${y}-${n}`, `BK-${y - 1}-${n}`, `BK-${n}`];
}
async function findByRef(q) {
  const c = refCandidates(q), qq = String(q || '').trim();
  const old = /^\d{3,10}$/.test(qq) ? qq : '';
  if (!c.length && !old) { S.refHits = null; return; }
  const out = new Map();
  if (c.length) (await db.collection('bookings').where('ref', 'in', c).get()).docs.forEach(d => out.set(d.id, { id: d.id, ...d.data() }));
  if (old) (await db.collection('bookings').where('oldRef', '==', old).get()).docs.forEach(d => out.set(d.id, { id: d.id, ...d.data() }));
  S.refHits = [...out.values()];
  const fin = await getFinMany(S.refHits.map(r => r.id)); fin.forEach((v, k) => S.listFin.set(k, v));
}
function filteredRows() {
  const F = S.filter, q = F.q.toLowerCase();
  return (S.listRows || []).filter(b => (F.status === 'all' || (F.status === 'active' ? ACTIVE.includes(b.status) : b.status === F.status))
    && (F.sp === 'all' || b.salespersonId === F.sp) && (F.car === 'all' || b.carId === F.car)
    && (F.type === 'all' || (F.type === 'sub' ? b.carType === 'sublease' : b.carType !== 'sublease'))
    && (!q || [b.ref, b.oldRef, b.clientName, b.clientPhone, b.plate, b.carName, b.location, b.supplier].join(' ').toLowerCase().includes(q)));
}
function rangeFor(r) {
  const t = todayStr(), y = t.slice(0, 4), m1 = t.slice(0, 8) + '01';
  if (r === 'month') return [m1, addDays(addDays(m1, 32).slice(0, 8) + '01', -1)];
  if (r === 'last') { const lm = addDays(m1, -1); return [lm.slice(0, 8) + '01', lm]; }
  if (r === 'year') return [y + '-01-01', y + '-12-31'];
  if (r === 'next') return [t, addDays(t, 30)];

function parseCarLines(text) {
  const known = new Set(S.cars.map(c => plateKey(c.plate)));
  const seen = new Set(), ok = [], skipped = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
    const [make = '', model = '', year = '', plate = '', color = '', category = ''] = parts;
    if (/^make$/i.test(make)) return;
    const key = plateKey(plate);
    if (!make || !model || !plate) skipped.push(`Line ${i + 1}: needs make, model and plate`);
    else if (known.has(key)) skipped.push(`Line ${i + 1}: plate ${plate} is already in your list`);
    else if (seen.has(key)) skipped.push(`Line ${i + 1}: plate ${plate} appears twice`);
    else { seen.add(key); const d = { make, model, year, plate: plate.toUpperCase(), color, category, type: 'own', active: true }; d.name = carTitle(d); ok.push(d); }
  });
  return { ok, skipped };
}

function splitTSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

  const m = {};
  row.forEach((h, i) => { const k = String(h ?? '').replace(/\s+/g, ' ').trim().toLowerCase(); for (const [key, re] of Object.entries(IMP_COLS)) if (m[key] == null && re.test(k)) m[key] = i; });

}
function impDate(v) {
  if (v instanceof Date && !isNaN(v)) return localStr(new Date(v.getTime() + 30000));
  const s = String(v ?? '').replace(/\s+/g, ' ').trim();
  const m = s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if (!m) return '';
  let [, d, mo, y, h = '0', mi = '0'] = m; if (y.length === 2) y = '20' + y;
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return '';
  return `${y}-${pad(+mo)}-${pad(+d)}T${pad(+h)}:${pad(+mi)}`;
}
const plateSig = p => { const s = String(p || '').toUpperCase(); return { d: (s.match(/\d+/g) || []).join(''), l: (s.match(/[A-Z]+/g) || []).join('') }; };
function findCarByPlate(p) {
  const t = plateSig(p); if (!t.d) return null;
  let hit = S.cars.filter(c => { const x = plateSig(c.plate); return x.d === t.d && x.l === t.l; });
  if (hit.length === 1) return hit[0];

}
function buildImport(table) {

  if (hi < 0) return { error: 'Could not find the heading row. The pasted data needs the headings Agreement No, Vehicle and Start Date.' };
  const m = mapHeader(table[hi]), get = (r, k) => m[k] == null ? '' : r[m[k]];
  const items = [], seenPlates = new Map(); let notOpen = 0;
  table.slice(hi + 1).forEach(r => {
    const ref = String(get(r, 'ref') ?? '').trim();
    if (!ref || !/\d/.test(ref) || /sum/i.test(ref)) return;
    if (m.status != null && String(get(r, 'status')).trim() && !/open/i.test(String(get(r, 'status')))) { notOpen++; return; }
    const plate = String(get(r, 'plate') ?? '').replace(/\s+/g, ' ').replace(/-\s+/, '-').trim().toUpperCase();
    const rateRaw = String(get(r, 'rate') ?? '').replace(/,/g, '').replace(/\s+/g, ' ');
    const rm = rateRaw.match(/([\d.]+)\s*\/?\s*(month|day)?/i);
    const typeTxt = String(get(r, 'type') ?? '');
    const rateType = rm && rm[2] ? (/month/i.test(rm[2]) ? 'month' : 'day') : (/month/i.test(typeTxt) ? 'month' : 'day');
    const it = { ref, plate, customer: String(get(r, 'customer') ?? '').replace(/\s+/g, ' ').trim(), phone: String(get(r, 'phone') ?? '').split(/[,\/]/)[0].trim(),
      driver: String(get(r, 'driver') ?? '').replace(/\s+/g, ' ').trim(), nat: String(get(r, 'nat') ?? '').trim(), notes: String(get(r, 'notes') ?? '').trim(),
      start: impDate(get(r, 'start')), end: impDate(get(r, 'end')), rate: rm ? +(+rm[1]).toFixed(4) : 0, rateType, problems: [], warns: [] };
    if (!it.plate) it.problems.push('no vehicle plate');
    if (!it.customer) it.problems.push('no customer name');
    if (!it.start) it.problems.push('start date not readable');
    it.car = it.plate ? findCarByPlate(it.plate) : null;
    if (it.plate && !it.car) it.warns.push('plate not in your list, will be added as a sub-lease car');
    if (it.start) {

            car = newCars.get(key);
            if (!car) {
              const r = db.collection('cars').doc();
              const d = { make: 'Sub-lease', model: it.plate, year: '', plate: it.plate, color: '', supplier: 'To confirm', type: 'sublease', active: true, category: '' };
              d.name = carTitle(d); batch.set(r, d); ops++; car = { id: r.id, ...d }; newCars.set(key, car);
            }
          }
          const future = parseDT(it.start) > new Date();
          const note = [`Imported from agreement ${it.ref}`, it.driver && it.driver.toLowerCase() !== it.customer.toLowerCase() ? `Driver: ${it.driver}${it.nat ? ' (' + it.nat + ')' : ''}` : (it.nat ? `Nationality: ${it.nat}` : ''), it.notes, it.endMissing ? 'END DATE MISSING IN REPORT: pickup set to import day, please correct' : ''].filter(Boolean).join('. ');
          const bref = db.collection('bookings').doc();
          batch.set(bref, {
            ref: refs[n], oldRef: it.ref, clientName: it.customer, clientPhone: it.phone, clientPhoneKey: phoneKey(it.phone), location: '', pickupLocation: '',
            carId: car.id, carName: carTitle(car), plate: car.plate, carType: isSub(car) ? 'sublease' : 'own', supplier: isSub(car) ? car.supplier || '' : '',
            deliveryAt: it.start, deliveryDate: it.start.slice(0, 10), pickupAt: it.end, pickupDate: it.end.slice(0, 10), days: Math.max(1, dayDiff(it.start.slice(0, 10), it.end.slice(0, 10))),
            salespersonId: sp.id, salespersonName: sp.name, salespersonUid: sp.uid || '', deliveryDriverId: '', deliveryDriverName: '', pickupDriverId: '', pickupDriverName: '',
            notes: note, status: future ? 'booked' : 'onrent', ...(future ? {} : { deliveredAt: it.start, deliveryHandover: { km: '', fuel: '', notes: 'Imported, car already with client', by: 'Import' } }),
            createdAt: FV.serverTimestamp(), createdBy: S.me.name, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name,
            log: [{ at: nowLocal(), by: S.me.name, text: `Imported from agreements report (agreement ${it.ref})` }]
          });
          batch.set(db.doc('finance/' + bref.id), { rate: it.rate, rateType: it.rateType, vatMode: 'plus', advance: 0, advanceMethod: 'cash', ref: refs[n] });
          ops += 2;
          if (ops >= 400) await flush();
        }
        await flush();
        S.imp = null; S.formOpen = false; S.listRows = null;
        toast(`${rows.length} agreements imported${newCars.size ? `, ${newCars.size} sub-lease cars added` : ''}.`);
        location.hash = '#/home';
      } catch (e) { go.disabled = false; go.textContent = 'Try again'; $('#im-err2').textContent = friendlyError(e); }
    };
  };
  return { title: 'Import agreements', back: '#/more', html, mount, form: true };
}

boot();

</script>
</body>
</html>
