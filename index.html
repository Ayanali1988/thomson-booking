<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thomson Booking</title>
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thomson Booking">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122033;--navy:#16324F;--navy-2:#234A72;--paper:#F2F4F7;--card:#FFFFFF;--line:#DCE2E9;--line-2:#C5CFDA;--muted:#5A6A7B;
  --deliv:#1D63B8;--deliv-bg:#E6EFFA;--pick:#9A5800;--pick-bg:#FCEFD8;--done:#2B7A4B;--done-bg:#E1F1E7;--late:#B92F26;--late-bg:#FBE7E5;
  --head:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;--body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--deliv)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
.main{max-width:760px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
:focus-visible{outline:3px solid #7FB0EA;outline-offset:2px}

/* top bars */
.topbar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back svg{width:26px;height:26px}
.topbar .back{color:#fff;text-decoration:none;font-size:15px;display:flex;align-items:center;gap:4px;min-height:40px}
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.hero .logo{height:52px;width:auto;max-width:150px;background:#fff;border-radius:var(--r-sm);padding:4px}
.wordmark{display:flex;flex-direction:column;line-height:1;background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:8px 10px}
.wm-1{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.02em}
.wm-2{font-size:11px;margin-top:3px;color:var(--navy-2)}
.hero .welcome{font-size:15px;line-height:1.35}
.hero .who{font-size:13px;opacity:.8;margin-top:2px}

/* date bar */
.datebar{max-width:760px;margin:0 auto;padding:18px 16px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.bigdate{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.01em;text-align:center}
.datebar .sub{text-align:center;margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

/* strips */
.strip{border-radius:var(--r);padding:12px 14px;margin:12px 0}
.strip h3{font-size:15px;margin-bottom:6px}
.strip.late{background:var(--late-bg);border:1px solid #F1B8B2;color:#7A1C16}
.strip.info{background:var(--deliv-bg);border:1px solid #B9D1F0;color:#123E73}
.strip a.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);text-decoration:none;color:inherit;font-size:14px}
.strip a.row:first-of-type{border-top:0}

/* timeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.timeline{list-style:none;margin:8px 0 0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:71px;top:6px;bottom:6px;width:2px;background:var(--line)}
.task{display:grid;grid-template-columns:58px 1fr;column-gap:26px;position:relative;padding:6px 0}
.task::before{content:"";position:absolute;left:66px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--deliv);box-shadow:0 0 0 3px var(--paper)}
.task.pickup::before{background:#D08A1C}
.task.done::before{background:var(--done)}
.task.late::before{background:var(--late)}
.t-time{font-family:var(--head);font-weight:800;font-size:17px;text-align:right;padding-top:14px;line-height:1.1}
.t-time small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.t-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.task.done .t-card{background:#F7FBF8;border-color:#CBE5D4}
.task.late .t-card{border-color:#E9A39C;background:#FFF8F7}
.task.soon .t-card{border-color:#E4A94A;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,169,74,.0)}50%{box-shadow:0 0 0 6px rgba(228,169,74,.35)}}
@media (prefers-reduced-motion:reduce){.task.soon .t-card{animation:none;box-shadow:0 0 0 4px rgba(228,169,74,.35)}}
.t-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.t-car{font-weight:700;font-size:16px}
.plate{display:inline-block;border:1.5px solid var(--ink);border-radius:5px;padding:0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;margin-left:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.t-meta{font-size:14px;color:var(--muted);margin-top:2px}
.t-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EDF0F4;color:#34465A;white-space:nowrap}
.chip.delivery{background:var(--deliv-bg);color:#154C8E}
.chip.pickup{background:var(--pick-bg);color:#7A4500}
.chip.done,.chip.closed{background:var(--done-bg);color:#1F5E39}
.chip.late,.chip.cancelled{background:var(--late-bg);color:#8E231C}
.chip.soon{background:#FFE7BF;color:#7A4500}
.chip.mine{background:var(--navy);color:#fff}
.chip.booked{background:var(--deliv-bg);color:#154C8E}
.chip.onrent{background:#E8E4F8;color:#3E2F8A}
.chip.returned,.chip.pending{background:var(--pick-bg);color:#7A4500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:15px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.danger{color:var(--late);border-color:#E9A39C}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 auto}

/* cards, sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .big{font-family:var(--head);font-weight:800;font-size:18px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}
.list-row{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;text-decoration:none;color:inherit}
.list-row .lr-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list-row .lr-sub{font-size:14px;color:var(--muted);margin-top:3px}
.list-row .lr-when{font-weight:700;margin-top:4px}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;cursor:pointer;text-align:left}
.menu{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0}
.menu :last-child{border-bottom:0}

/* forms */
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 0}
label.f>input,label.f>select,label.f>textarea,.f-in{display:block;width:100%;margin-top:5px;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;color:var(--ink);font-size:16px}
label.f>textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.grid2>*{min-width:0}
label.f>input{min-width:0;-webkit-appearance:none;appearance:none}
label.f>input[type=date],label.f>input[type=time]{-webkit-appearance:none;appearance:none}
.err{color:var(--late);font-size:14px;margin:8px 0 0;min-height:1em}
.warn{background:var(--pick-bg);border:1px solid #EFC98A;color:#6B3D00;border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-top:12px}
.calc{background:#F6F8FB;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;margin-top:14px;font-size:15px}
.calc .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.calc .r.t{font-weight:700;border-top:1px solid var(--line-2);margin-top:6px;padding-top:6px}
.calc .r.g{font-family:var(--head);font-weight:800;font-size:19px}
.pill-choice{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill-choice label{flex:1 1 0;min-width:90px}
.pill-choice input{position:absolute;opacity:0;pointer-events:none}
.pill-choice span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 8px;background:#fff;cursor:pointer;color:var(--ink);font-size:15px}
.pill-choice input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.pill-choice input:focus-visible+span{outline:3px solid #7FB0EA}
.line{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) 102px 26px;gap:6px;align-items:center;margin-top:8px}
.line input,.line select{min-height:42px;padding:8px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;width:100%;font-size:15px;min-width:0}
.line .x{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.line .lock{font-size:13px;color:var(--muted);padding-left:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 0;min-height:48px}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--navy);font-weight:700}
.nav a.add span.plus{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:-4px}
.nav a.add svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:4px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:var(--r-sm);font-size:15px}
.toast.alert{background:#7A4500}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth-card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:400px}
.auth-card .wordmark{background:var(--paper);display:inline-flex}
.auth-card .logo{height:56px;width:auto}
.auth-card h1{font-size:22px;margin:16px 0 4px}

/* tables on screen */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}

/* print */
#print{display:none}
@media print{
  html,body{background:#fff!important;padding:0}
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font:11px/1.4 var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #16324F;padding-bottom:8px;margin-bottom:12px;gap:16px}
.p-brand{display:flex;align-items:center;gap:10px}
.p-logo{height:46px;width:auto}
.p-wm{font-family:var(--head);font-weight:800;font-size:20px;color:#16324F;border:2px solid #16324F;padding:4px 8px;border-radius:4px}
.p-co{font-family:var(--head);font-weight:800;font-size:15px;color:#16324F}
.p-addr{font-size:10px;color:#444}
.p-title{text-align:right}
.p-title h1{font-size:17px;color:#16324F}
.p-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.p-tbl th{background:#16324F;color:#fff;text-align:left;padding:5px 6px;font-weight:600;font-size:10.5px}
.p-tbl td{padding:5px 6px;border-bottom:1px solid #CCD3DB;vertical-align:top}
.p-tbl tr:nth-child(even) td{background:#F3F6F9}
.p-tbl .r{text-align:right}
.p-tbl tfoot td{font-weight:700;background:#E6ECF2!important;border-top:2px solid #16324F}
.p-sec{margin-top:12px}
.p-sec h2{font-size:12.5px;color:#16324F;border-bottom:1px solid #16324F;padding-bottom:3px;margin-bottom:6px}
.p-kv{display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:4px 10px}
.p-kv dt{color:#555}
.p-kv dd{margin:0}
.p-big{font-weight:800;font-size:13px}
.p-sign{display:flex;justify-content:space-between;gap:30px;margin-top:40px}
.p-sign div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
.p-foot{margin-top:14px;font-size:9.5px;color:#555;text-align:right}
.p-type-d{color:#154C8E;font-weight:700}
.p-type-p{color:#7A4500;font-weight:700}
.p-total td{font-size:12.5px}

</style>
</head>

<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* =========================================================
   SETTINGS YOU EDIT ONCE (see SETUP.md)
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDPIDkRcNbTiVEetfoEqjQF_9i3s1m7kys",
  authDomain: "thomson-booking.firebaseapp.com",
  projectId: "thomson-booking",
  storageBucket: "thomson-booking.firebasestorage.app",
  messagingSenderId: "76349976130",
  appId: "1:76349976130:web:d50370c3b9ff26fbfd47db"
};
const LOGO_URL = '';            // e.g. 'logo.png' after uploading your logo to the repository
const COMPANY = 'Thomson Rent A Car LLC';
const EMAIL_DOMAIN = 'thomson-booking.app'; // internal only: usernames become username@this-domain

/* ========================================================= helpers */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localStr = d => `${dstr(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayStr = () => dstr(new Date());
const nowLocal = () => localStr(new Date());
const parseDT = s => { if (!s) return null; const [a, b = '00:00'] = s.split('T'); const [y, m, d] = a.split('-').map(Number); const [h, mi] = b.split(':').map(Number); return new Date(y, m - 1, d, h || 0, mi || 0); };
const addDays = (ds, n) => { const [y, m, d] = ds.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const dayDiff = (a, b) => Math.round((parseDT(b + 'T12:00') - parseDT(a + 'T12:00')) / 864e5);
const fmtLong = ds => parseDT(ds + 'T12:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtDate = ds => ds ? parseDT(ds.slice(0, 10) + 'T12:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDay = ds => ds ? parseDT(ds.slice(0, 10) + 'T12:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : '';
const time12 = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const tOf = s => s ? s.slice(11, 16) : '';
const fmtDT = s => s ? `${fmtDate(s)}, ${time12(tOf(s))}` : '';
const money = n => (Math.round(((+n || 0) + Number.EPSILON) * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const r2 = n => Math.round(((+n || 0) + Number.EPSILON) * 100) / 100;
const durText = ms => { const m = Math.max(1, Math.round(Math.abs(ms) / 60000)); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), mm = m % 60; if (h < 48) return mm ? `${h} h ${mm} min` : `${h} h`; return `${Math.round(h / 24)} days`; };
const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  car: '<path d="M3.5 13.5 5.5 7h13l2 6.5V18h-17z M3.5 13.5h17 M7 16h.01 M17 16h.01 M6 18v2 M18 18v2"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3.2"/>',
  left: '<path d="M15 6l-6 6 6 6"/>',
  right: '<path d="M9 6l6 6-6 6"/>'
};
const ico = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const STATUS = { booked: 'Booked', onrent: 'On rent', returned: 'Returned, to settle', pending: 'Pending charges', closed: 'Closed', cancelled: 'Cancelled' };
const ACTIVE = ['booked', 'onrent', 'returned', 'pending'];
const MODE_LABEL = { plus: '+VAT', incl: 'Incl. VAT', none: 'No VAT' };
const FUEL = ['Empty', '1/4', '1/2', '3/4', 'Full'];

/* ========================================================= VAT & totals */
const vatRate = () => ((S.settings.vatRate ?? 5) / 100);
function lineCalc(amount, mode, v = vatRate()) {
  amount = +amount || 0;
  if (mode === 'plus') { const vat = r2(amount * v); return { net: r2(amount), vat, gross: r2(amount + vat) }; }
  if (mode === 'incl') { const net = r2(amount / (1 + v)); return { net, vat: r2(amount - net), gross: r2(amount) }; }
  return { net: r2(amount), vat: 0, gross: r2(amount) };
}
function calcSettlement(s, v = vatRate()) {
  const rows = [];
  const rent = lineCalc((+s.rentDays || 0) * (+s.rate || 0), s.vatMode, v);
  rows.push({ label: `Rent ${+s.rentDays || 0} day${+s.rentDays === 1 ? '' : 's'} × ${money(s.rate)}`, mode: s.vatMode, ...rent });
  (s.lines || []).forEach(l => { if (+l.amount) rows.push({ label: l.label || 'Other', mode: l.mode, ...lineCalc(l.amount, l.mode, v) }); });
  if (+s.fines) rows.push({ label: 'Traffic fines', mode: 'none', ...lineCalc(s.fines, 'none', v) });
  const taxable = r2(rows.filter(r => r.mode !== 'none').reduce((a, r) => a + r.net, 0));
  const vat = r2(rows.reduce((a, r) => a + r.vat, 0));
  const nonTaxable = r2(rows.filter(r => r.mode === 'none').reduce((a, r) => a + r.gross, 0));
  const subtotal = r2(rows.reduce((a, r) => a + r.gross, 0));
  const cc = s.method === 'card' ? r2(subtotal * (+s.ccPct || 0) / 100) : 0;
  const ccVat = r2(cc * v);
  const total = r2(subtotal + cc + ccVat);
  const advance = r2(s.advance);
  return { rows, taxable, vat, nonTaxable, subtotal, cc, ccVat, total, advance, balance: r2(total - advance) };
}

    if (b.deliveryDate === D) out.push({ b, type: 'delivery', at: b.deliveryAt, done: !!b.deliveredAt });
    if (b.pickupDate === D && b.deliveredAt) out.push({ b, type: 'pickup', at: b.pickupAt, done: !!b.pickedUpAt });

ACT.resched = ({ id, type }) => {
  const b = getB(id); if (!b) return;
  const cur = type === 'delivery' ? b.deliveryAt : b.pickupAt;
  const base = new Date(Math.max(parseDT(cur).getTime(), Date.now()));
  base.setSeconds(0, 0); base.setMinutes(Math.ceil(base.getMinutes() / 5) * 5);
  const plus = m => localStr(new Date(base.getTime() + m * 60000));
  const o = openSheet(`<h2>Reschedule ${type}</h2>
    <p class="muted">${carLabel(b)}, ${esc(b.clientName)}<br>Now: <strong>${esc(fmtDT(cur))}</strong></p>
    <div class="btnrow" style="margin-top:6px">${[30, 60, 120].map(m => `<button class="btn sm" data-q="${plus(m)}">+${m < 60 ? m + ' min' : m / 60 + ' hour' + (m > 60 ? 's' : '')}</button>`).join('')}</div>
    <div class="grid2"><label class="f">New date<input type="date" id="r-date" value="${cur.slice(0, 10)}"></label><label class="f">New time<input type="time" id="r-time" value="${tOf(cur)}"></label></div>
    <label class="f">Reason (optional)<input id="r-why" list="r-reasons" placeholder="Client requested later time"><datalist id="r-reasons"><option>Client requested</option><option>Client not reachable</option><option>Client delayed</option><option>Car not ready</option><option>Driver delayed</option></datalist></label>
    <p class="err" id="r-err"></p>
    <div class="btnrow"><button class="btn" data-act="close">Go back</button><button class="btn primary" id="r-save">Save new time</button></div>`);
  o.querySelectorAll('[data-q]').forEach(btn => btn.onclick = () => { o.querySelector('#r-date').value = btn.dataset.q.slice(0, 10); o.querySelector('#r-time').value = tOf(btn.dataset.q); });
  o.querySelector('#r-save').onclick = async ev => {
    const nd = $('#r-date').value, nt = $('#r-time').value, why = $('#r-why').value.trim();
    if (!nd || !nt) { $('#r-err').textContent = 'Pick a date and time.'; return; }
    const at = `${nd}T${nt}`;
    if (at === cur) { closeSheet(); return; }
    const upd = { updatedAt: FV.serverTimestamp(), updatedBy: S.me.name };
    let text = `${type === 'delivery' ? 'Delivery' : 'Pickup'} moved from ${fmtDT(cur)} to ${fmtDT(at)}`;
    if (type === 'delivery') {
      upd.deliveryAt = at; upd.deliveryDate = nd;
      const pu = `${addDays(nd, +b.days)}T${nt}`; upd.pickupAt = pu; upd.pickupDate = pu.slice(0, 10);
    } else {
      upd.pickupAt = at; upd.pickupDate = nd;
      const newDays = dayDiff(b.deliveryDate, nd);
      if (isStaff() && newDays > 0 && newDays !== +b.days) {
        closeSheet();
        const yes = await ask({ title: newDays > b.days ? 'Charge as extension?' : 'Early return', text: `Pickup is now ${newDays} day${newDays === 1 ? '' : 's'} after delivery. Change rental days from ${b.days} to ${newDays}?`, ok: `Change to ${newDays} days` });
        if (yes) { upd.days = newDays; text += `, days changed ${b.days} to ${newDays}`; }
      }
    }
    if (why) text += ` (${why})`;
    upd.log = FV.arrayUnion({ at: nowLocal(), by: S.me.name, text });
    try { await db.doc('bookings/' + id).update(upd); closeSheet(); toast('New time saved.'); }
    catch (e) { const er = $('#r-err'); if (er) er.textContent = friendlyError(e); else onErr(e); }
  };
};

ACT.ics = ({ id, type }) => {
  const b = getB(id); if (!b) return;

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Thomson Booking//EN', 'BEGIN:VEVENT',
    `UID:${b.id}-${type}-${f(at)}@thomson-booking`, `DTSTAMP:${f(nowLocal())}`, `DTSTART:${f(at)}`, `DTEND:${f(end)}`,
    `SUMMARY:${clean(`${type === 'delivery' ? 'Delivery' : 'Pickup'}: ${b.carName} ${b.plate}, ${b.clientName}`)}`,
    `LOCATION:${clean(loc)}`, `DESCRIPTION:${clean(`${b.ref}\nClient phone: ${b.clientPhone || '-'}`)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:Task in 30 minutes', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');

      const pu = x.date && x.time && x.days ? `${addDays(x.date, x.days)}T${x.time}` : '';
      $('#b-calc').innerHTML = `${pu ? `<div class="r"><span>Return</span><strong>${esc(fmtDT(pu))}</strong></div>` : ''}
        <div class="r"><span>Rent ${x.days} × ${money(x.rate)}</span><span>${money(e.net)}</span></div>
        <div class="r"><span>VAT ${S.settings.vatRate ?? 5}%${x.vat === 'incl' ? ' (included)' : ''}</span><span>${money(e.vat)}</span></div>
        <div class="r t g"><span>Total AED</span><span>${money(e.gross)}</span></div>
        ${x.adv ? `<div class="r"><span>Balance after advance</span><span>${money(e.gross - x.adv)}</span></div>` : ''}`;
      const cf = x.carId && pu ? conflicts(x.carId, `${x.date}T${x.time}`, pu, id) : [];
      $('#b-conf').innerHTML = cf.length ? `<div class="warn"><strong>This car is already booked for overlapping dates:</strong>${cf.map(c => `<br>${esc(c.ref)}, ${esc(c.clientName)}, ${esc(fmtDT(c.deliveryAt))} to ${esc(fmtDT(c.pickupAt))}`).join('')}</div>` : '';
      return { x, pu, cf };
    };
    $$('#app input, #app select, #app textarea').forEach(el => el.addEventListener('input', upd));
    upd();
    $('#b-save').onclick = async ev => {
      const { x, pu, cf } = upd();
      const err = !x.name ? 'Enter the client name.' : !x.loc ? 'Enter the delivery location.' : !x.carId ? 'Choose a car.' : !x.date || !x.time ? 'Enter the delivery date and time.'
        : x.days < 1 ? 'Days must be at least 1.' : !x.rate ? 'Enter the daily rate.' : !x.sp ? 'Choose the salesperson.' : '';
      $('#b-err').textContent = err; if (err) return;
      if (cf.length && !(await ask({ title: 'Car already booked', text: 'This car overlaps with another booking. Save anyway?', ok: 'Save anyway' }))) return;
      ev.target.disabled = true;
      const car = S.cars.find(c => c.id === x.carId) || {}, sp = S.sales.find(s => s.id === x.sp) || {}, dr = S.users.find(u => u.id === x.drv) || {};
      const data = {
        clientName: x.name, clientPhone: x.phone, location: x.loc, pickupLocation: x.ploc, carId: x.carId, carName: car.name || '', plate: car.plate || '',
        deliveryAt: `${x.date}T${x.time}`, deliveryDate: x.date, pickupAt: pu, pickupDate: pu.slice(0, 10), days: x.days,
        salespersonId: x.sp, salespersonName: sp.name || '', salespersonUid: sp.uid || '', deliveryDriverId: x.drv, deliveryDriverName: dr.name || '',
        notes: x.notes, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name
      };
      const fin = { rate: x.rate, vatMode: x.vat, advance: x.adv, advanceMethod: x.advm };
      try {
        const batch = db.batch();
        if (!id) {
          const ref = await nextRef();
          const docRef = db.collection('bookings').doc();
          batch.set(docRef, { ...data, ref, status: 'booked', pickupDriverId: '', pickupDriverName: '', createdAt: FV.serverTimestamp(), createdBy: S.me.name, log: [{ at: nowLocal(), by: S.me.name, text: 'Booking created' }] });
          batch.set(db.doc('finance/' + docRef.id), { ...fin, ref });
          await batch.commit(); S.formOpen = false; toast(`Booking ${ref} created.`); location.hash = '#/booking/' + docRef.id;
        } else {
          batch.update(db.doc('bookings/' + id), { ...data, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: 'Booking edited' }) });
          batch.set(db.doc('finance/' + id), fin, { merge: true });
          await batch.commit(); S.formOpen = false; toast('Changes saved.'); location.hash = '#/booking/' + id;
        }
      } catch (e) { ev.target.disabled = false; $('#b-err').textContent = friendlyError(e); }
    };
  };
  return { title: id ? `Edit ${b.ref}` : 'New booking', back: id ? '#/booking/' + id : '#/home', html, mount, form: true };
}

/* ========================================================= return settlement */
function viewSettle(id) {
  if (!isStaff()) return deny();
  ensureDetail(id);
  const b = getB(id), f = S.fin.get(id);
  if (!b || !f) return { title: 'Settle return', back: '#/booking/' + id, html: loading() };
  const st = f.settlement || {};
  const vm = f.vatMode || 'plus';
  const ccOpts = String(S.settings.ccOptions || '4,5').split(',').map(s => +s.trim()).filter(n => n > 0);
  const init = {
    rentDays: st.rentDays ?? b.days, lines: st.lines || [{ label: 'Salik', amount: '', mode: vm }, { label: 'Parking', amount: '', mode: vm }],
    fines: st.fines ?? '', advance: st.advance ?? (f.advance || 0), method: st.method || 'cash', ccPct: st.ccPct ?? (S.settings.defaultCc || ccOpts[ccOpts.length - 1] || 5), notes: st.notes || ''
  };
  const elapsed = b.deliveredAt && b.pickedUpAt ? Math.max(1, Math.ceil((parseDT(b.pickedUpAt) - parseDT(b.deliveredAt)) / 864e5 - 0.0417)) : null;
  const modeSel = m => `<select aria-label="VAT">${['plus', 'incl'].map(k => `<option value="${k}" ${m === k ? 'selected' : ''}>${MODE_LABEL[k]}</option>`).join('')}</select>`;
  const lineRow = l => `<div class="line" data-line><input aria-label="Charge" value="${esc(l.label)}" placeholder="Other charge"><input aria-label="Amount" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(l.amount)}" placeholder="0">${modeSel(l.mode)}<button class="x" type="button" aria-label="Remove">×</button></div>`;
  const locked = b.status === 'closed';
  const html = `
  <section class="card"><div class="t-top" style="justify-content:space-between"><h2 style="margin:0">${esc(b.ref)}</h2>${statusChip(b.status)}</div>
    <p style="margin:6px 0 0">${carLabel(b)}, ${esc(b.clientName)}</p>
    <p class="small muted" style="margin:4px 0 0">Delivered ${esc(fmtDT(b.deliveredAt) || '-')}, returned ${esc(fmtDT(b.pickedUpAt) || '-')}${elapsed ? `, about ${elapsed} day${elapsed === 1 ? '' : 's'} used` : ''}</p>
    ${locked ? '<p class="warn">This booking is closed. Change any figure and save to reopen and update it.</p>' : ''}
  </section>
  <section class="card"><h2>Rent</h2>
    <div class="grid2"><label class="f">Rent days<input id="s-days" type="number" inputmode="numeric" min="0" step="1" value="${esc(init.rentDays)}"></label>
    <label class="f">Daily rate (AED)<input id="s-rate" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(f.rate)}"></label></div>
    <p class="small muted" style="margin:6px 0 0">Booked for ${b.days} days, ${MODE_LABEL[vm]}. Add extension days here.</p>
  </section>
  <section class="card"><h2>Charges at return</h2>
    <div class="line small muted" style="margin-top:0"><span>Charge</span><span>Amount</span><span>VAT</span><span></span></div>
    <div id="s-lines">${init.lines.map(lineRow).join('')}</div>
    <button class="btn sm" id="s-add" type="button" style="margin-top:8px">Add charge</button>
    <div class="line" style="margin-top:12px"><span style="font-weight:600">Traffic fines</span><input id="s-fines" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(init.fines)}" placeholder="0" aria-label="Fines amount"><span class="lock">No VAT</span><span></span></div>
  </section>
  <section class="card"><h2>Payment</h2>
    <label class="f">Advance already paid (AED)<input id="s-adv" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(init.advance)}"></label>
    <div class="f" style="margin-top:12px;color:var(--muted);font-size:14px">Payment method</div>
    <div class="pill-choice" role="radiogroup" aria-label="Payment method">${[['cash', 'Cash'], ['card', 'Card'], ['bank', 'Bank transfer']].map(([k, l]) => `<label><input type="radio" name="s-pay" value="${k}" ${init.method === k ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
    <div id="s-ccbox"><div class="f" style="margin-top:12px;color:var(--muted);font-size:14px">CC charges</div>
    <div class="pill-choice" role="radiogroup" aria-label="CC charges">${ccOpts.map(p => `<label><input type="radio" name="s-cc" value="${p}" ${+init.ccPct === p ? 'checked' : ''}><span>${p}%</span></label>`).join('')}</div></div>
    <label class="f">Notes<input id="s-notes" value="${esc(init.notes)}" placeholder="Salik for 24 Sep still to post"></label>
    <div class="calc" id="s-sum"></div>
  </section>
  <p class="err" id="s-err" role="alert"></p>
  <div class="btnrow"><button class="btn" id="s-pending">Save, charges pending</button><button class="btn primary" id="s-close">Close booking</button></div>
  <div class="btnrow"><a class="btn" href="#/booking/${id}">Go back</a>${f.settlement ? `<button class="btn" data-act="bill" data-id="${id}">Final bill PDF</button>` : ''}</div>`;
  const mount = () => {
    const read = () => {
      const lines = $$('[data-line]').map(r => { const [l, a, m] = r.querySelectorAll('input,select'); return { label: l.value.trim(), amount: parseFloat(a.value) || 0, mode: m.value }; });
      const method = ($('input[name=s-pay]:checked') || {}).value || 'cash';
      const s = { rentDays: parseInt($('#s-days').value, 10) || 0, rate: parseFloat($('#s-rate').value) || 0, vatMode: vm, lines, fines: parseFloat($('#s-fines').value) || 0,
        advance: parseFloat($('#s-adv').value) || 0, method, ccPct: +((($('input[name=s-cc]:checked') || {}).value) || 0), notes: $('#s-notes').value.trim() };
      if (method !== 'card') s.ccPct = 0;
      return s;
    };
    const upd = () => {
      const s = read();
      $('#s-ccbox').classList.toggle('hidden', s.method !== 'card');
      const totals = calcSettlement(s);
      $('#s-sum').innerHTML = settlementRowsHtml({ ...s, totals });
      return { s, totals };
    };
    const wire = root => {
      root.querySelectorAll('input,select').forEach(el => el.addEventListener('input', upd));
      root.querySelectorAll('.x').forEach(x => x.onclick = () => { x.closest('[data-line]').remove(); upd(); });
    };
    wire($('#app'));
    $('#s-add').onclick = () => { const w = document.createElement('div'); w.innerHTML = lineRow({ label: '', amount: '', mode: vm }); const row = w.firstElementChild; $('#s-lines').appendChild(row); wire(row); row.querySelector('input').focus(); };
    upd();
    const save = async (status, btn) => {
      const { s, totals } = upd();
      const bad = s.lines.find(l => l.amount && !l.label);
      if (bad) { $('#s-err').textContent = 'Give every charge a name.'; return; }
      if (status === 'closed' && !(await ask({ title: `Close ${b.ref}?`, text: `Total AED ${money(totals.total)}${totals.advance ? `, balance due AED ${money(totals.balance)}` : ''}. You can still reopen it later.`, ok: 'Close booking' }))) return;
      btn.disabled = true;
      const settlement = { ...s, totals, settledAt: nowLocal(), settledBy: S.me.name };
      try {
        const batch = db.batch();
        batch.set(db.doc('finance/' + id), { rate: s.rate, settlement }, { merge: true });
        batch.update(db.doc('bookings/' + id), { status, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: status === 'closed' ? `Closed, total AED ${money(totals.total)}, paid by ${s.method}` : `Settlement saved, charges pending (AED ${money(totals.total)} so far)` }) });
        await batch.commit(); S.formOpen = false; toast(status === 'closed' ? 'Booking closed.' : 'Saved as pending charges.'); location.hash = '#/booking/' + id;
      } catch (e) { btn.disabled = false; $('#s-err').textContent = friendlyError(e); }
    };
    $('#s-pending').onclick = e => save('pending', e.target);
    $('#s-close').onclick = e => save('closed', e.target);
  };
  return { title: 'Settle return', back: '#/booking/' + id, html, mount, form: true };
}

/* ========================================================= bookings list (bulk) */
async function loadList() {
  const F = S.filter;
  const s = await db.collection('bookings').where('deliveryDate', '>=', F.from).where('deliveryDate', '<=', F.to).get();
  S.listRows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, c) => a.deliveryAt.localeCompare(c.deliveryAt));
  S.listFin = await getFinMany(S.listRows.map(r => r.id));
}
function filteredRows() {
  const F = S.filter, q = F.q.toLowerCase();
  return (S.listRows || []).filter(b => (F.status === 'all' || (F.status === 'active' ? ACTIVE.includes(b.status) : b.status === F.status))
    && (F.sp === 'all' || b.salespersonId === F.sp) && (F.car === 'all' || b.carId === F.car)
    && (!q || [b.ref, b.clientName, b.clientPhone, b.plate, b.carName, b.location].join(' ').toLowerCase().includes(q)));
}

  ${rows.map(b => { const f = S.listFin.get(b.id); return `<a class="list-row" href="#/booking/${b.id}">
      <div class="lr-top"><strong>${esc(b.ref)}, ${esc(b.clientName)}</strong>${statusChip(b.status)}</div>

function printHeader(title, sub) {

const printFoot = () => `<div class="p-foot">Printed by ${esc(S.me.name)} on ${esc(fmtDT(nowLocal()))}</div>`;
function doPrint(html, landscape) {
  $('#print').innerHTML = html;
  let ps = $('#pagestyle'); if (!ps) { ps = document.createElement('style'); ps.id = 'pagestyle'; document.head.appendChild(ps); }
  ps.textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:12mm}`;
  const imgs = $$('#print img'); let n = imgs.length;
  const go = () => setTimeout(() => window.print(), 150);
  if (!n) return go();
  imgs.forEach(i => { if (i.complete) { if (--n === 0) go(); } else { i.onload = i.onerror = () => { if (--n === 0) go(); }; } });
}
ACT.daysheet = async () => {
  const D = S.viewDate, tasks = tasksFor(D), staff = isStaff();
  const fins = await getFinMany([...new Set(tasks.map(t => t.b.id))]);

  const rows = tasks.map((t, i) => {
    const b = t.b, f = fins.get(b.id), e = f ? estimate(b, f) : null;
    if (t.type === 'delivery' && e) total += e.gross;
    const loc = t.type === 'pickup' ? (b.pickupLocation || b.location) : b.location;
    return `<tr><td>${i + 1}</td><td><strong>${time12(tOf(t.at))}</strong></td><td class="${t.type === 'delivery' ? 'p-type-d' : 'p-type-p'}">${t.type === 'delivery' ? 'Delivery' : 'Pickup'}${t.done ? ' (done)' : ''}</td>

  }).join('');
  const nd = tasks.filter(t => t.type === 'delivery').length;
  doPrint(`${printHeader('Daily delivery and pickup sheet', fmtLong(D))}

    <tbody>${body || '<tr><td colspan="11">No bookings.</td></tr>'}</tbody><tfoot><tr><td colspan="10">${rows.length} bookings (cancelled excluded from total)</td><td class="r">${money(total)}</td></tr></tfoot></table>${printFoot()}`, true);
};

boot();

</script>
