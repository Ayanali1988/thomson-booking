<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booking</title>
<meta name="theme-color" content="#16324F">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booking">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#112038;--navy:#13294B;--navy-2:#21456F;--night:#0C1C33;--amber:#E8A33D;--paper:#EDF1F5;--card:#FFFFFF;--line:#DCE2E9;--line-2:#C5CFDA;--muted:#5A6A7B;
  --deliv:#1F6FD1;--deliv-bg:#E6EFFA;--pick:#9A5800;--pick-bg:#FCEFD8;--done:#2B7A4B;--done-bg:#E1F1E7;--late:#B92F26;--late-bg:#FBE7E5;
  --head:'Archivo',system-ui,-apple-system,Segoe UI,sans-serif;--body:'Public Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--deliv)}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.2}
.main{max-width:760px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
:focus-visible{outline:3px solid #7FB0EA;outline-offset:2px}

/* top bars */
.topbar{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back svg{width:26px;height:26px}
.topbar .back{color:#fff;text-decoration:none;font-size:15px;display:flex;align-items:center;gap:4px;min-height:40px}
.hero{background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px}
.hero-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.hero .logo{height:52px;width:auto;max-width:150px;background:#fff;border-radius:var(--r-sm);padding:4px}
.wordmark{display:flex;flex-direction:column;line-height:1;background:#fff;color:var(--navy);border-radius:var(--r-sm);padding:8px 10px}
.wm-1{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:.02em}
.wm-2{font-size:11px;margin-top:3px;color:var(--navy-2)}
.hero .welcome{font-size:15px;line-height:1.35}
.hero .who{font-size:13px;opacity:.8;margin-top:2px}

/* date bar */
.datebar{max-width:760px;margin:0 auto;padding:18px 16px 6px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.bigdate{font-size:clamp(24px,6.5vw,32px);font-weight:800;letter-spacing:-.01em;text-align:center}
.datebar .sub{text-align:center;margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
.seg button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;min-height:36px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}

/* strips */
.strip{border-radius:var(--r);padding:12px 14px;margin:12px 0}
.strip h3{font-size:15px;margin-bottom:6px}
.strip.late{background:var(--late-bg);border:1px solid #F1B8B2;color:#7A1C16}
.strip.info{background:var(--deliv-bg);border:1px solid #B9D1F0;color:#123E73}
.strip a.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08);text-decoration:none;color:inherit;font-size:14px}
.strip a.row:first-of-type{border-top:0}

/* timeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.timeline{list-style:none;margin:8px 0 0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:71px;top:6px;bottom:6px;width:2px;background:var(--line)}
.task{display:grid;grid-template-columns:58px 1fr;column-gap:26px;position:relative;padding:6px 0}
.task::before{content:"";position:absolute;left:66px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--deliv);box-shadow:0 0 0 3px var(--paper)}
.task.pickup::before{background:#D08A1C}
.task.done::before{background:var(--done)}
.task.late::before{background:var(--late)}
.t-time{font-family:var(--head);font-weight:800;font-size:17px;text-align:right;padding-top:14px;line-height:1.1}
.t-time small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.t-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.task.done .t-card{background:#F7FBF8;border-color:#CBE5D4}
.task.late .t-card{border-color:#E9A39C;background:#FFF8F7}
.task.soon .t-card{border-color:#E4A94A;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(228,169,74,.0)}50%{box-shadow:0 0 0 6px rgba(228,169,74,.35)}}
@media (prefers-reduced-motion:reduce){.task.soon .t-card{animation:none;box-shadow:0 0 0 4px rgba(228,169,74,.35)}}
.t-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.t-car{font-weight:700;font-size:16px}
.plate{display:inline-block;border:1.5px solid var(--ink);border-radius:5px;padding:0 6px;font-size:13px;font-weight:700;letter-spacing:.04em;margin-left:4px;vertical-align:1px;font-variant-numeric:tabular-nums}
.t-meta{font-size:14px;color:var(--muted);margin-top:2px}
.t-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#EDF0F4;color:#34465A;white-space:nowrap}
.chip.delivery{background:var(--deliv-bg);color:#154C8E}
.chip.pickup{background:var(--pick-bg);color:#7A4500}
.chip.done,.chip.closed{background:var(--done-bg);color:#1F5E39}
.chip.late,.chip.cancelled{background:var(--late-bg);color:#8E231C}
.chip.soon{background:#FFE7BF;color:#7A4500}
.chip.mine{background:var(--navy);color:#fff}
.chip.booked{background:var(--deliv-bg);color:#154C8E}
.chip.onrent{background:#E8E4F8;color:#3E2F8A}
.chip.returned,.chip.pending{background:var(--pick-bg);color:#7A4500}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:15px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.danger{color:var(--late);border-color:#E9A39C}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btnrow .btn{flex:1 1 auto}

/* cards, sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.card h2{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:6px 12px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv .big{font-family:var(--head);font-weight:800;font-size:18px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}
.list-row{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0;text-decoration:none;color:inherit}
.list-row .lr-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.list-row .lr-sub{font-size:14px;color:var(--muted);margin-top:3px}
.list-row .lr-when{font-weight:700;margin-top:4px}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:var(--card);border:0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:16px;cursor:pointer;text-align:left}
.menu{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0}
.menu :last-child{border-bottom:0}

/* forms */
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 0}
label.f>input,label.f>select,label.f>textarea,.f-in{display:block;width:100%;margin-top:5px;min-height:44px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;color:var(--ink);font-size:16px}
label.f>textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.grid2>*{min-width:0}
label.f>input{min-width:0;-webkit-appearance:none;appearance:none}
label.f>input[type=date],label.f>input[type=time]{-webkit-appearance:none;appearance:none}
.err{color:var(--late);font-size:14px;margin:8px 0 0;min-height:1em}
.warn{background:var(--pick-bg);border:1px solid #EFC98A;color:#6B3D00;border-radius:var(--r-sm);padding:10px 12px;font-size:14px;margin-top:12px}
.calc{background:#F6F8FB;border:1px dashed var(--line-2);border-radius:var(--r-sm);padding:12px;margin-top:14px;font-size:15px}
.calc .r{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.calc .r.t{font-weight:700;border-top:1px solid var(--line-2);margin-top:6px;padding-top:6px}
.calc .r.g{font-family:var(--head);font-weight:800;font-size:19px}
.pill-choice{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill-choice label{flex:1 1 0;min-width:90px}
.pill-choice input{position:absolute;opacity:0;pointer-events:none}
.pill-choice span{display:block;text-align:center;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 8px;background:#fff;cursor:pointer;color:var(--ink);font-size:15px}
.pill-choice input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.pill-choice input:focus-visible+span{outline:3px solid #7FB0EA}
.line{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.9fr) 102px 26px;gap:6px;align-items:center;margin-top:8px}
.line input,.line select{min-height:42px;padding:8px 6px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;width:100%;font-size:15px;min-width:0}
.line .x{border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
.line .lock{font-size:13px;color:var(--muted);padding-left:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none;padding:4px 0;min-height:48px}
.nav a svg{width:23px;height:23px}
.nav a.on{color:var(--navy);font-weight:700}
.nav a.add span.plus{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;margin-top:-4px}
.nav a.add svg{width:24px;height:24px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,35,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:19px;margin-bottom:4px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:var(--r-sm);font-size:15px}
.toast.alert{background:#7A4500}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--navy)}
.auth-card{background:#fff;border-radius:16px;padding:24px 20px;width:100%;max-width:400px}
.auth-card .wordmark{background:var(--paper);display:inline-flex}
.auth-card .logo{height:56px;width:auto}
.auth-card h1{font-size:22px;margin:16px 0 4px}

/* tables on screen */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}


/* ===== visual layer v2 ===== */
h1,h2,h3,.bigdate,.stat strong,.t-time{font-stretch:112%}
body{background:var(--paper)}
.topbar{background:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.topbar h1{font-stretch:112%}

.hero{position:relative;overflow:hidden;background:var(--navy);padding:calc(16px + env(safe-area-inset-top)) 16px 64px}
.skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;pointer-events:none}
.hero-in{position:relative;display:block;max-width:760px;margin:0 auto}
.hero-top{display:flex;align-items:center;gap:14px}
.hero .welcome{font-size:15px;line-height:1.35;font-weight:600}
.hero .who{font-size:13px;opacity:.75;margin-top:2px}
.hero-date{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:22px}
.hero .bigdate{color:#fff;font-size:clamp(26px,7.4vw,40px);line-height:1.08;text-align:center;letter-spacing:-.01em}
.hero .seg{margin-bottom:10px}
.hero .seg button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}
.hero .seg button.on{background:var(--amber);border-color:var(--amber);color:var(--night);font-weight:700}
.iconbtn.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:#fff}

.stats{position:relative;z-index:2;max-width:760px;margin:-42px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;background:#fff;border-radius:14px;padding:12px 14px 11px;text-decoration:none;color:var(--ink);box-shadow:0 1px 2px rgba(12,28,51,.08),0 6px 18px rgba(12,28,51,.07);border-top:4px solid var(--c)}
.stat strong{font-family:var(--head);font-weight:800;font-size:30px;line-height:1.05;color:var(--c)}
.stat strong small{font-size:15px;color:var(--muted);font-weight:600}
.stat span{font-size:13.5px;font-weight:600;margin-top:2px}
.stat em{font-style:normal;font-size:12.5px;color:var(--muted)}
.s-d{--c:var(--deliv)}.s-p{--c:#B86E06}.s-r{--c:#5B3FB0}.s-f{--c:var(--done)}

.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.sec-head h2{font-size:18px}
.sec-head .toolbar{margin:0}

.t-card{box-shadow:inset 4px 0 0 var(--deliv),0 1px 2px rgba(12,28,51,.05);border-radius:12px}
.task.pickup .t-card{box-shadow:inset 4px 0 0 #D8912A,0 1px 2px rgba(12,28,51,.05)}
.task.done .t-card{box-shadow:inset 4px 0 0 var(--done)}
.task.late .t-card{box-shadow:inset 4px 0 0 var(--late)}
.t-car{display:flex;align-items:center;gap:10px}
.t-car>span{flex:1;min-width:0}
.car-ico{width:42px;height:20px;flex:none;fill:var(--deliv)}
.car-ico .w{fill:var(--night);stroke:#fff;stroke-width:2}
.car-ico .g{fill:#fff;opacity:.55}
.task.pickup .car-ico{fill:#D8912A}
.task.done .car-ico{fill:var(--done)}
.task.late .car-ico{fill:var(--late)}
.car-ico.big{width:110px;height:52px;fill:#B9C5D3;margin:0 auto 10px;display:block}

.plate{background:#fff;border:1.5px solid #1A1A1A;border-radius:5px;box-shadow:inset 3px 0 0 #C8372D;padding:0 6px 0 9px}

.cat-h{display:flex;align-items:center;gap:8px;font-size:16px;margin:18px 0 8px}
.cat-h .dot{width:10px;height:10px;border-radius:50%}
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.car-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;font:inherit;color:var(--ink);cursor:pointer;width:100%}
div.car-tile{cursor:default}
.car-tile .car-ico{width:64px;height:30px;fill:var(--cc);margin-bottom:4px}
.car-tile .ct-name{font-weight:700;font-size:15px;line-height:1.25}
.car-tile .ct-sub{font-size:13px;color:var(--muted)}
.car-tile .sno{position:absolute;top:8px;right:10px;font-size:12px;color:var(--muted)}
.car-tile.off{opacity:.6}
button.car-tile:active{transform:scale(.98)}

.card,.list-row{border-radius:14px}
.btn.primary{box-shadow:0 2px 6px rgba(19,41,75,.25)}
.nav a.add span.plus{background:var(--amber);color:var(--night);box-shadow:0 3px 10px rgba(232,163,61,.45)}
.nav a.on{color:var(--navy)}

.auth{position:relative;overflow:hidden;background:var(--navy)}
.auth .skyline{height:220px}
.auth-card{position:relative;z-index:1;box-shadow:0 20px 50px rgba(0,0,0,.3)}


/* ===== v3: board, availability, calendar, sub-lease ===== */
.main.wide{max-width:1240px}
.hero.home .hero-in{max-width:1240px}
.stats.wide{max-width:1240px}
button.stat{font:inherit;text-align:left;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
a.car-tile{text-decoration:none}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 88px;gap:0 10px}
.grid3>*{min-width:0}
.hire{background:#FFF8EC;border:1px solid #EFC98A;border-radius:12px;padding:4px 12px 12px;margin-top:12px}
.hire h3{font-size:15px;margin:10px 0 0;color:#6B3D00}
.late-warn{background:var(--late-bg);border-color:#E9A39C;color:#7A1C16}
.chip.sub{background:#F3E8FF;color:#5B2C91}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.seg.left{justify-content:flex-start;flex-wrap:wrap;margin:10px 0 0}
.seg.wrap{flex-wrap:wrap}

.sec-head{align-items:flex-end}
.tabs-m{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.tabs-m button{border:1px solid var(--line-2);background:#fff;border-radius:12px;padding:6px 4px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:48px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.tabs-m button span{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:#E6EBF1;font-size:12px;font-weight:700}
.tabs-m button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs-m button.on span{background:var(--amber);color:var(--night)}
.board{margin-top:8px}
.board .col{display:none}
.board.tab-all .col-all,.board.tab-d .col-d,.board.tab-p .col-p,.board.tab-a .col-a{display:block}
.col-h{display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0;padding:10px 14px;color:#fff}

/* charges entered by the driver at pickup */
function pickupRead() {
  const v = id => parseFloat(($('#' + id) || {}).value) || 0;
  const method = ($('#h-paym') || {}).value || 'cash';
  return { salik: v('h-salik'), parking: v('h-park'), fines: v('h-fines'), extraDays: parseInt(($('#h-xdays') || {}).value, 10) || 0,
    otherLabel: (($('#h-othl') || {}).value || '').trim(), otherAmount: v('h-otha'), method, ccPct: method === 'card' ? +((($('input[name=h-cc]:checked') || {}).value) || 0) : 0 };
}
function pickupCalc(b, f, pc) {
  const vm = f.vatMode || 'plus', v = vatRate(), rows = [];
  const rent = estimate({ ...b, days: (+b.days || 0) + (f.rateType === 'month' ? 0 : pc.extraDays) }, f);
  rows.push({ label: `Rent ${(+b.days || 0) + (f.rateType === 'month' ? 0 : pc.extraDays)} days${pc.extraDays && f.rateType !== 'month' ? ` (incl. ${pc.extraDays} extra)` : ''}`, gross: rent.gross });
  [['Salik', pc.salik], ['Parking', pc.parking], [pc.otherLabel || 'Other', pc.otherAmount]].forEach(([l, a]) => { if (a) rows.push({ label: `${l} (${MODE_LABEL[vm]})`, gross: lineCalc(a, vm, v).gross }); });
  if (pc.fines) rows.push({ label: 'Traffic fines (no VAT)', gross: r2(pc.fines) });
  const subtotal = r2(rows.reduce((s, r) => s + r.gross, 0));
  const cc = pc.method === 'card' ? r2(subtotal * (pc.ccPct || 0) / 100) : 0, ccVat = r2(cc * v);
  const total = r2(subtotal + cc + ccVat), paid = paidSoFar(f);
  return { rows, subtotal, cc, ccVat, ccPct: pc.ccPct, total, paid, due: r2(total - paid), method: pc.method };
}

  const monthly = f.rateType === 'month', cur = b.pickupAt, cd = cur.slice(0, 10), ct = tOf(cur);
  const opts = monthly ? [['1 week', addDays(cd, 7)], ['2 weeks', addDays(cd, 14)], ['1 month', addMonths(cd, 1)], ['2 months', addMonths(cd, 2)]]
    : [['1 day', addDays(cd, 1)], ['2 days', addDays(cd, 2)], ['3 days', addDays(cd, 3)], ['5 days', addDays(cd, 5)], ['1 week', addDays(cd, 7)]];
  const o = openSheet(`<h2>Extend rental</h2>
    <p class="muted" style="margin:4px 0 0">${carLabel(b)}, ${esc(b.clientName)}${monthly ? ', monthly contract' : ''}<br>Return now: <strong>${esc(fmtDT(cur))}</strong> (${b.days} days)</p>
    <div class="ext-opts">${opts.map(([l, d]) => `<button class="btn" data-ext="${d}">+ ${l}</button>`).join('')}</div>
    <div class="grid2"><label class="f">New return date<input type="date" id="x-date" value="${opts[0][1]}"></label><label class="f">Time<input type="time" id="x-time" value="${ct}"></label></div>
    <div class="calc" id="x-sum"></div>
    <p class="err" id="x-err"></p>
    <div class="btnrow"><button class="btn" data-act="close">Go back</button><button class="btn primary" id="x-save">Extend</button></div>`);
  const upd = () => {
    const nd = $('#x-date').value, nt = $('#x-time').value || ct;
    o.querySelectorAll('[data-ext]').forEach(x => x.classList.toggle('on', x.dataset.ext === nd));
    if (!nd) return null;
    const at = `${nd}T${nt}`, days = dayDiff(b.deliveryDate, nd), add = days - (+b.days);
    const cf = conflicts(b.carId, b.deliveryAt, at, b.id);
    $('#x-sum').innerHTML = `<div class="r"><span>New return</span><strong>${esc(fmtDT(at))}</strong></div><div class="r"><span>Total rental</span><span>${days} days (${add >= 0 ? '+' : ''}${add})</span></div>
      ${cf.length ? `<div class="warn late-warn" style="margin-top:8px">This car is booked from ${esc(fmtDT(cf[0].deliveryAt))} (${esc(cf[0].ref)}, ${esc(cf[0].clientName)}). Extend anyway and arrange a different car for that booking.</div>` : ''}`;
    return { at, nd, days, add, cf };
  };
  o.querySelectorAll('[data-ext]').forEach(x => x.onclick = () => { $('#x-date').value = x.dataset.ext; upd(); });
  o.querySelector('#x-date').oninput = upd; o.querySelector('#x-time').oninput = upd; upd();
  o.querySelector('#x-save').onclick = async ev => {
    const r = upd();
    if (!r || r.at <= cur) { $('#x-err').textContent = 'Choose a return date later than the current one.'; return; }
    ev.target.disabled = true;
    try {
      await db.doc('bookings/' + id).update({ pickupAt: r.at, pickupDate: r.nd, days: r.days, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name,
        log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: `Extended by ${r.add} day${r.add === 1 ? '' : 's'}: return moved from ${fmtDT(cur)} to ${fmtDT(r.at)}${r.cf.length ? ` (clashes with ${r.cf.map(c => c.ref).join(', ')})` : ''}` }) });
      closeSheet(); toast(`${b.plate} extended to ${fmtDT(r.at)}.`);
      const h = S.listHash || ''; go(/^#\/(car|calendar)/.test(h) ? h : '#/home'); window.scrollTo(0, 0);
    } catch (e) { ev.target.disabled = false; $('#x-err').textContent = friendlyError(e); }
  };
};

/* two-week mini calendar on the home screen */
function miniCal(side) {
  const t = todayStr(), cnt = {};
  const bump = (d, k) => { (cnt[d] = cnt[d] || { d: 0, p: 0 })[k]++; };
  const all = new Map([...S.day, ...S.active]);
  for (const b of all.values()) {
    if (b.status === 'cancelled') continue;
    if (b.status === 'booked') bump(b.deliveryDate, 'd');
    if (b.status === 'booked' || b.status === 'onrent') bump(b.pickupDate, 'p');
  }
  const days = Array.from({ length: 14 }, (_, i) => addDays(t, i));
  return `<section class="mini-cal ${side ? 'mc-side' : 'mc-top'}" aria-label="Next two weeks">
    <div class="mc-head"><h2>Next 2 weeks</h2><span class="mc-leg"><span><i class="g"></i>Deliveries</span> <span><i class="r"></i>Pickups</span></span></div>
    <div class="mc-grid">${days.map(d => { const dt = parseDT(d + 'T12:00'), c = cnt[d] || { d: 0, p: 0 };
      return `<button class="mc-day ${d === t ? 'today' : ''} ${d === S.viewDate ? 'sel' : ''}" data-act="day" data-set="${d}" aria-label="${esc(fmtLong(d))}: ${c.d} deliveries, ${c.p} pickups">
        <span class="mc-w">${dt.toLocaleDateString('en-GB', { weekday: 'short' })}</span><span class="mc-n">${dt.getDate()}</span>${side ? `<span class="mc-m">${dt.toLocaleDateString('en-GB', { month: 'short' })}</span>` : ''}
        <span class="mc-dots">${c.d ? `<b class="g">${c.d}</b>` : ''}${c.p ? `<b class="r">${c.p}</b>` : ''}</span></button>`; }).join('')}</div></section>`;
}



/* plate finder: type any part of a plate to see where the car is */
function plateMatches(q) {
  const t = plateSig(q); if (!t.d && !t.l) return [];
  return S.cars.filter(c => { const x = plateSig(c.plate); return (!t.d || x.d.includes(t.d)) && (!t.l || x.l.includes(t.l)); })
    .sort((a, b) => (a.active === false) - (b.active === false) || String(a.plate).localeCompare(String(b.plate)));
}
function carNowHtml(c) {
  const now = new Date(), bs = [...S.active.values()].filter(b => b.carId === c.id && ACTIVE.includes(b.status)).sort((a, z) => a.deliveryAt.localeCompare(z.deliveryAt));
  const onr = bs.find(b => b.status === 'onrent'), next = bs.filter(b => b.status === 'booked');

  return `<div class="pf-car"><div class="lr-top"><span><span class="plate big">${esc(c.plate)}</span> <strong>${esc(p.make)} ${esc(p.model)} ${esc(p.year)}</strong></span>${state}</div>
    <div class="lr-sub">${esc([c.color, c.category, OWN_LABEL[ownershipOf(c)] + (isSub(c) ? ': ' + (c.supplier || '-') : c.investor ? ': ' + c.investor : '')].filter(Boolean).join(', '))}</div>
    ${onr ? `<a class="pf-line late-${parseDT(onr.pickupAt) < now}" href="#/booking/${onr.id}"><strong>With ${esc(onr.clientName)}</strong>${onr.clientPhone ? `, ${esc(onr.clientPhone)}` : ''}<br>Return ${esc(fmtDT(onr.pickupAt))}${parseDT(onr.pickupAt) < now ? ' <span class="chip late">Overdue</span>' : ''} <span class="muted">(${esc(onr.ref)}${onr.oldRef ? ', ' + esc(onr.oldRef) : ''})</span></a>` : ''}
    ${next.map(b => `<a class="pf-line" href="#/booking/${b.id}">Booked for <strong>${esc(b.clientName)}</strong><br>${esc(fmtDT(b.deliveryAt))} to ${esc(fmtDT(b.pickupAt))} <span class="muted">(${esc(b.ref)})</span></a>`).join('')}
    ${back ? `<a class="pf-line" href="#/booking/${back.id}">Returned by ${esc(back.clientName)}, waiting for settlement</a>` : ''}
    ${gar ? `<div class="pf-line"><strong>${esc(gar.purpose)}</strong> ${isNrm(gar) ? `with ${esc(gar.staff || '-')}` : `at ${esc(gar.garage)}`} since ${esc(fmtDT(gar.inAt))}${gar.expectedOut ? `, expected back ${esc(fmtDate(gar.expectedOut))}` : ''} <span class="muted">(${esc(gar.no)})</span></div>` : ''}
    <div class="t-actions"><a class="btn sm" href="#/car/${c.id}">Full history</a>${gar ? (isNrm(gar) ? `<button class="btn sm good" data-act="nrmback" data-car="${c.id}">Back from NRM</button>` : `<button class="btn sm good" data-act="garageout" data-car="${c.id}">Back from garage</button>`) : c.active !== false && !onr ? `<button class="btn sm" data-act="garagein" data-car="${c.id}">Send to garage</button><button class="btn sm" data-act="nrmstart" data-car="${c.id}">Start NRM</button>` : ''}${isStaff() && c.active !== false ? `<button class="btn sm primary" data-act="newforcar" data-id="${c.id}">New booking with this car</button>` : ''}</div></div>`;
}

/* uniform "BOOKED" message for the team WhatsApp group */
const amt = n => { const v = r2(n); return Number.isInteger(v) ? v.toLocaleString('en-US') : money(v); };
const dmy = s => { if (!s) return ''; const d = parseDT(s); return `${d.toLocaleDateString('en-GB', { weekday: 'short' })} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}, ${time12(tOf(s))}`; };
function bookedMsg(b, f, updated) {
  const phone = b.clientPhone ? '+' + waNum(b.clientPhone) : '', em = waStyle() === 'emoji', dot = em ? '•' : '-';
  const lines = [em ? `${EMO.carF} BOOKED ${EMO.ok} ${EMO.carF}` : '*BOOKED*', updated ? `${b.ref} (updated)` : b.ref, '',
    `${dot} Vehicle: ${b.carName}`,
    f ? `${dot} Rate: AED ${amt(f.rate)} per ${f.rateType === 'month' ? 'month' : 'day'}, ${f.vatMode === 'incl' ? 'VAT included' : '+VAT'}` : '',
    `${dot} Days: ${b.days}${b.extendable ? ' (Extendable)' : ''}`,
    `${dot} Delivery: ${dmy(b.deliveryAt)}`,
    `${dot} Return: ${dmy(b.pickupAt)}`,
    `${dot} Location: ${b.location || '-'}`,
    `${dot} Client: *${String(b.clientName || '').replace(/\*/g, '').trim()}*`,
    phone ? `${dot} Contact: ${phone}` : '',
    `${dot} Booked by: ${b.salespersonName || S.me.name}`,
    b.collectDocs ? (em ? `${EMO.doc} Collect documents at delivery` : 'Collect documents at delivery') : '',
    ''];
  const noteLines = String(b.notes || '').split(/\r?\n/).map(l => l.replace(/\*/g, '').trim()).filter(Boolean);
  const note = noteLines.length ? '\n\n\n' + noteLines.map((l, i) => i === 0 ? `*Note*: *${l}*` : `*${l}*`).join('\n') : '';
  return lines.filter((l, i) => l !== '' || i === 2).join('\n') + note;
}

ACT.assigncar = ({ id }) => {
  const b = getB(id); if (!b) return;
  const opts = () => carOptions(b.deliveryAt, b.pickupAt, '', b.id).replace(/<option value="__tba"[^>]*>[^<]*<\/option>/, '');
  const o = openSheet(`<h2>Assign car</h2><p class="muted" style="margin:4px 0 0">${esc(b.carName)} for ${esc(b.clientName)}<br><strong>${esc(fmtDT(b.deliveryAt))}</strong> to <strong>${esc(fmtDT(b.pickupAt))}</strong></p>
    <label class="f">Type plate to find the car<input id="ac-pq" autocomplete="off" autocapitalize="characters" placeholder="9182"></label>
    <label class="f">Car<select id="ac-car">${opts()}</select></label>
    <div id="ac-hire" class="hire hidden"><h3>New external car (sub-lease hire)</h3>
      <label class="f">Supplier<input id="ach-sup" list="ach-sups" placeholder="Al Futtaim Rent A Car"><datalist id="ach-sups">${suppliers().map(s => `<option>${esc(s)}</option>`).join('')}</datalist></label>
      <div class="grid3"><label class="f">Make<input id="ach-make" value="${esc(carParts({ name: b.carName }).make)}"></label><label class="f">Model<input id="ach-model" value="${esc(carParts({ name: b.carName }).model)}"></label><label class="f">Year<input id="ach-year" inputmode="numeric"></label></div>
      <div class="grid2"><label class="f">Color<input id="ach-color"></label><label class="f">Plate (if known)<input id="ach-plate" autocapitalize="characters" placeholder="TBC"></label></div></div>
    <p class="err" id="ac-err"></p>
    <div class="btnrow"><button class="btn" data-act="close">Go back</button><button class="btn primary" id="ac-save">Assign car</button></div>`);
  const sel = o.querySelector('#ac-car');
  const want = String(b.carName || '').toLowerCase();
  const match = [...sel.options].filter(op => op.value && !op.value.startsWith('__') && !op.disabled && op.textContent.toLowerCase().includes(want));
  if (match.length === 1) sel.value = match[0].value;
  const sync = () => o.querySelector('#ac-hire').classList.toggle('hidden', sel.value !== '__hire');
  sel.onchange = sync; sync();
  o.querySelector('#ac-pq').addEventListener('input', e => { const hits = plateMatches(e.target.value);
    [...sel.options].forEach(op => { if (!op.value || op.value.startsWith('__')) return; op.hidden = !!e.target.value.trim() && !hits.some(h => h.id === op.value); });
    const ok = hits.filter(h => { const op = [...sel.options].find(x => x.value === h.id); return op && !op.disabled; }); if (ok.length === 1) { sel.value = ok[0].id; sync(); } });
  o.querySelector('#ac-save').onclick = async ev => {
    const v = sel.value; if (!v) { $('#ac-err').textContent = 'Choose the car.'; return; }
    ev.target.disabled = true;
    try {
      const batch = db.batch(); let car;
      if (v === '__hire') {
        const h = { supplier: $('#ach-sup').value.trim(), make: $('#ach-make').value.trim(), model: $('#ach-model').value.trim(), year: $('#ach-year').value.trim(), color: $('#ach-color').value.trim(), plate: $('#ach-plate').value.trim().toUpperCase() || 'TBC' };
        if (!h.supplier || !h.make || !h.model) { ev.target.disabled = false; $('#ac-err').textContent = 'Enter the supplier, make and model.'; return; }
        const ex = h.plate !== 'TBC' ? S.cars.find(c => plateKey(c.plate) === plateKey(h.plate)) : null;
        if (ex && !isSub(ex)) { ev.target.disabled = false; $('#ac-err').textContent = `Plate ${h.plate} is your own car. Choose it from the list.`; return; }
        const d = { ...h, type: 'sublease', ownership: 'sublease', active: true, category: ex ? ex.category || '' : '' }; d.name = carTitle(d);
        if (ex) { batch.update(db.doc('cars/' + ex.id), d); car = { id: ex.id, ...d }; } else { const r = db.collection('cars').doc(); batch.set(r, d); car = { id: r.id, ...d }; }
      } else car = S.cars.find(c => c.id === v);
      batch.update(db.doc('bookings/' + id), { carId: car.id, carName: carTitle(car), plate: car.plate, carType: isSub(car) ? 'sublease' : 'own', supplier: isSub(car) ? car.supplier || '' : '', carTba: false, carIds: [car.id],
        updatedAt: FV.serverTimestamp(), updatedBy: S.me.name, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: `Car assigned: ${car.plate}, ${carTitle(car)}` }) });
      await batch.commit(); closeSheet(); toast(`${car.plate} assigned to ${b.ref}.`); if (S.route === 'booking') render();
    } catch (e) { ev.target.disabled = false; $('#ac-err').textContent = friendlyError(e); }
  };
};

const PASTE_TEMPLATE = 'Car name: \nDate: \nTime: \nDays: \nLocation: \nPrice: \nClient: \nContact number: ';
function parseBookingMsg(text) {
  const raw = String(text || '').replace(/\r/g, '');
  const lines = raw.split('\n').map(l => l.replace(/^[\s•*\-–]+/, '').trim()).filter(Boolean);
  const kv = re => { for (const l of lines) { const m = l.match(re); if (m) return (m[1] || '').trim(); } return null; };
  const out = { found: [], lines };
  const yr0 = new Date().getFullYear();
  const mkDate = (d, mo, y) => { let yy = y ? (y.length === 2 ? '20' + y : y) : String(yr0); let s = `${yy}-${pad(+mo)}-${pad(+d)}`; if (!y && s < addDays(todayStr(), -60)) s = `${+yy + 1}-${pad(+mo)}-${pad(+d)}`; return +mo >= 1 && +mo <= 12 && +d >= 1 && +d <= 31 ? s : null; };
  // car: best match against the fleet
  let best = null;
  for (const l of lines) {
    const low = ' ' + l.toLowerCase().replace(/[^a-z0-9]+/g, ' ') + ' ';
    const hits = S.cars.filter(c => c.active !== false).filter(c => { const p = carParts(c); const toks = [p.make, p.model].join(' ').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ').filter(Boolean); return toks.length && toks.every(t => low.includes(' ' + t + ' ')); });
    if (hits.length) { const p = carParts(hits[0]); best = { model: [p.make, p.model].filter(Boolean).join(' '), cars: S.cars.filter(c => { const q = carParts(c); return q.make === p.make && q.model === p.model && c.active !== false; }), line: l }; break; }
  }
  if (!best) { const v = kv(/^(?:vehicle|car(?:\s*name)?)\s*[:\-]\s*(.+)$/i); if (v) best = { model: v, cars: [], line: v }; }
  if (best) { out.car = best; out.found.push('car'); }
  // rate
  const rl = lines.find(l => /rate|price|@/i.test(l) && /\d/.test(l));
  if (rl) { const m = rl.replace(/,/g, '').match(/(?:(?:rate|price)\s*[:\-]?\s*(?:aed)?\s*|@\s*(?:aed)?\s*)([\d.]+)/i); if (m) { out.rate = +m[1]; out.found.push('rate'); if (/incl|inclusive|incld|with\s*(vat|tax)/i.test(rl)) out.vat = 'incl'; else if (/\+\s*(vat|tax)|plus\s*vat|excl/i.test(rl)) out.vat = 'plus'; if (/month/i.test(rl)) out.rateType = 'month'; } }
  // dates
  const rng = raw.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?\s*(?:to|till|until|–|-)\s*(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/i);
  if (rng) { out.from = mkDate(rng[1], rng[2], rng[3]); out.to = mkDate(rng[4], rng[5], rng[6] || rng[3]); }
  if (!out.from) { const d = kv(/^date\s*[:\-]\s*(.+)$/i) || ''; const m = d.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/); if (m) out.from = mkDate(m[1], m[2], m[3]); }
  const dd = kv(/^days?\s*[:\-]\s*(\d+)/i); if (dd) out.days = +dd;
  if (/extend(able|ible)?/i.test(raw)) out.ext = true;
  if (out.from && out.to && !out.days) out.days = Math.max(1, dayDiff(out.from, out.to));
  if (out.from) out.found.push('date'); if (out.days) out.found.push('days');
  // time
  const tl = lines.find(l => /time|delivery|deliver|at\s+\d/i.test(l) && /\d/.test(l)) || '';
  const tm = (kv(/^time\s*[:\-]\s*(.+)$/i) || tl).match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/i);
  if (tm && (tm[3] || tm[2] || /time/i.test(tl))) { let h = +tm[1] % 24; const mi = tm[2] ? +tm[2] : 0; if (tm[3]) { const pm = /pm/i.test(tm[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; } if (h < 24 && mi < 60) { out.time = `${pad(h)}:${pad(mi)}`; out.found.push('time'); } }
  // location, client, phone
  const loc = kv(/^(?:location|from|place|address)\s*[:\-]\s*(.*)$/i); if (loc && !/^\d{1,2}([:.]\d{2})?\s*(am|pm)?$/i.test(loc)) { out.location = loc; out.found.push('location'); }
  let cl = kv(/^(?:client(?:\s*name)?|customer|name)\s*[:\-]\s*(.+)$/i);
  if (!cl) cl = lines.filter(l => !/\d/.test(l) && !/:\s*$/.test(l) && !/book|confirm|delivery|return|location|rate|price|vehicle|car name|contact|date|days?\b|time|from/i.test(l) && (!best || l !== best.line) && /[a-z]/i.test(l)).pop() || null;
  if (cl) { out.client = cl.replace(/[✅🚘!]+/g, '').trim(); out.found.push('client'); }
  const pl = kv(/^(?:contact(?:\s*(?:no|number|#))?|phone(?:\s*number)?|mobile|tel|whatsapp)\s*[:\-]\s*(.+)$/i) || (raw.match(/(\+\d[\d\s\-]{7,}\d)/) || [])[1];
  if (pl) { out.phone = pl.replace(/[^\d+\s\-]/g, '').trim(); out.found.push('phone'); }
  return out;
}

    });

        <div class="r"><span>VAT ${S.settings.vatRate ?? 5}%${x.vat === 'incl' ? ' (included)' : ''}</span><span>${money(e.vat)}</span></div>
        <div class="r t g"><span>Total AED</span><span>${money(e.gross)}</span></div>

    $('#b-pq').addEventListener('input', e => {

      const err = !x.name ? 'Enter the client name.' : !x.carId ? 'Choose a car, or Car model only.' : tba && !tbaModel ? 'Type the car model, for example Nissan Patrol.'

      const batch0 = db.batch();
      let car;

        const pk = h.plate && h.plate !== 'TBC' ? plateKey(h.plate) : '';
        const ex = pk ? S.cars.find(c => plateKey(c.plate) === pk) : null;

        const data = { make: h.make, model: h.model, year: h.year, color: h.color, plate: h.plate || 'TBC', supplier: h.supplier, type: 'sublease', active: true, category: ex ? ex.category || '' : '' };
        data.name = carTitle(data);
        if (ex) { batch0.update(db.doc('cars/' + ex.id), data); car = { id: ex.id, ...data }; }
        else { const r = db.collection('cars').doc(); batch0.set(r, data); car = { id: r.id, ...data }; }
      } else if (tba) car = { id: '', plate: '', name: tbaModel, make: tbaModel, type: 'tba' };
      else car = S.cars.find(c => c.id === x.carId) || {};
      ev.target.disabled = true;
      const sp = S.sales.find(s => s.id === x.sp) || {}, dr = S.users.find(u => u.id === x.drv) || {};
      const data = {
        oldRef: x.agr, clientName: x.name, clientPhone: x.phone, clientPhoneKey: phoneKey(x.phone), location: x.loc, pickupLocation: x.ploc, carId: car.id, carName: tba ? tbaModel : carTitle(car), plate: car.plate || '',
        carType: tba ? 'tba' : isSub(car) ? 'sublease' : 'own', supplier: isSub(car) ? car.supplier || '' : '', carTba: tba,
        carIds: [...new Set([...((b && b.legs) || []).map(l => l.carId), car.id].filter(Boolean))],
        deliveryAt: `${x.date}T${x.time}`, deliveryDate: x.date, pickupAt: pu, pickupDate: pu.slice(0, 10), days: x.days,
        salespersonId: x.sp, salespersonName: sp.name || (b && !x.sp && b.salespersonName ? b.salespersonName : S.me.name), salespersonUid: sp.uid || (b && !x.sp ? b.salespersonUid || '' : (x.sp ? '' : S.me.id)), deliveryDriverId: x.drv, deliveryDriverName: dr.name || '',
        notes: x.notes, collectDocs: x.docs, extendable: x.ext, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name
      };
      const fin = { rate: x.rate, rateType: x.rt, vatMode: x.vat, advance: x.adv, advanceMethod: x.advm };
      try {
        const batch = batch0;
        if (!id) {
          const ref = await nextRef();
          const docRef = db.collection('bookings').doc();
          batch.set(docRef, { ...data, ref, status: 'booked', pickupDriverId: '', pickupDriverName: '', createdAt: FV.serverTimestamp(), createdBy: S.me.name, log: [{ at: nowLocal(), by: S.me.name, text: 'Booking created' }] });
          batch.set(db.doc('finance/' + docRef.id), { ...fin, ref });
          await batch.commit(); S.formOpen = false; toast(`Booking ${ref} created for ${fmtDT(data.deliveryAt)}.`); goHomeOn(x.date);
          setTimeout(() => openBookedMsg({ ...data, ref, id: docRef.id }, fin, true), 120);
        } else {
          batch.update(db.doc('bookings/' + id), { ...data, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: 'Booking edited' }) });
          batch.set(db.doc('finance/' + id), fin, { merge: true });
          await batch.commit(); S.formOpen = false; toast('Changes saved.'); goHomeOn(x.date);
          setTimeout(() => openBookedMsg({ ...b, ...data, id }, { ...f, ...fin }, true, true), 120);
        }
      } catch (e) { ev.target.disabled = false; $('#b-err').textContent = friendlyError(e); }
    };
  };
  return { title: id ? `Edit ${b.ref}` : 'New booking', back: id ? '#/booking/' + id : (S.listHash || '#/home'), html, mount, form: true };
}

/* ========================================================= return settlement */
function viewSettle(id) {
  if (!isStaff()) return deny();
  ensureDetail(id);
  const b = getB(id), f = S.fin.get(id);
  if (!b || !f) return { title: 'Settle return', back: '#/booking/' + id, html: loading() };
  const st = f.settlement || {};
  const vm = f.vatMode || 'plus', monthly = f.rateType === 'month', pc0 = f.pickupCharges || null;
  const ccOpts = String(S.settings.ccOptions || '4,5').split(',').map(s => +s.trim()).filter(n => n > 0);
  const init = {

    fines: st.fines ?? (pc0 ? pc0.fines || '' : ''), advance: st.advance ?? paidSoFar(f), method: st.method || (pc0 && pc0.method) || 'cash', ccPct: st.ccPct ?? ((pc0 && pc0.ccPct) || S.settings.defaultCc || ccOpts[ccOpts.length - 1] || 5), notes: st.notes || ''
  };
  const elapsed = b.deliveredAt && b.pickedUpAt ? Math.max(1, Math.ceil((parseDT(b.pickedUpAt) - parseDT(b.deliveredAt)) / 864e5 - 0.0417)) : null;
  const modeSel = m => `<select aria-label="VAT">${['plus', 'incl'].map(k => `<option value="${k}" ${m === k ? 'selected' : ''}>${MODE_LABEL[k]}</option>`).join('')}</select>`;
  const lineRow = l => `<div class="line" data-line><input aria-label="Charge" value="${esc(l.label)}" placeholder="Other charge"><input aria-label="Amount" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(l.amount)}" placeholder="0">${modeSel(l.mode)}<button class="x" type="button" aria-label="Remove">×</button></div>`;
  const rc = (f.rateChanges || []).slice().sort((x, y) => x.at.localeCompare(y.at));
  if (!monthly && rc.length && !init.rentLines) {
    const pts = [(b.deliveredAt || b.deliveryAt).slice(0, 10), ...rc.map(x => x.at.slice(0, 10))], rates = [rc[0].from, ...rc.map(x => x.to)];
    init.rentLines = rates.map((r, i) => ({ rate: r, days: i < rates.length - 1 ? Math.max(0, dayDiff(pts[i], pts[i + 1])) : 0 }));
    const used = init.rentLines.reduce((s, l) => s + l.days, 0); init.rentLines[init.rentLines.length - 1].days = Math.max(0, (+b.days || 0) + (pc0 ? +pc0.extraDays || 0 : 0) - used);
  }
  const split = !monthly && Array.isArray(init.rentLines) && init.rentLines.length > 1;
  const locked = b.status === 'closed';
  const html = `

    <p style="margin:6px 0 0">${carLabel(b)}, ${esc(b.clientName)}</p>

    : `<div class="grid2"><label class="f">Rent days<input id="s-days" type="number" inputmode="numeric" min="0" step="1" value="${esc(init.rentDays)}"></label>
    <label class="f">Daily rate (AED)<input id="s-rate" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(f.rate)}"></label></div>
    <p class="small muted" style="margin:6px 0 0">Booked for ${b.days} days, ${MODE_LABEL[vm]}. Add extension days here.</p>`}
  </section>
  <section class="card"><h2>Charges at return</h2>
    <div class="line small muted" style="margin-top:0"><span>Charge</span><span>Amount</span><span>VAT</span><span></span></div>
    <div id="s-lines">${init.lines.map(lineRow).join('')}</div>
    <button class="btn sm" id="s-add" type="button" style="margin-top:8px">Add charge</button>
    <div class="line" style="margin-top:12px"><span style="font-weight:600">Traffic fines</span><input id="s-fines" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(init.fines)}" placeholder="0" aria-label="Fines amount"><span class="lock">No VAT</span><span></span></div>
  </section>

    <div id="s-ccbox"><div class="f" style="margin-top:12px;color:var(--muted);font-size:14px">CC charges</div>
    <div class="pill-choice" role="radiogroup" aria-label="CC charges">${ccOpts.map(p => `<label><input type="radio" name="s-cc" value="${p}" ${+init.ccPct === p ? 'checked' : ''}><span>${p}%</span></label>`).join('')}</div></div>
    <label class="f">Notes<input id="s-notes" value="${esc(init.notes)}" placeholder="Salik for 24 Sep still to post"></label>
    <div class="calc" id="s-sum"></div>
  </section>
  <p class="err" id="s-err" role="alert"></p>

  const mount = () => {

      const lines = $$('[data-line]').map(r => { const [l, a, m] = r.querySelectorAll('input,select'); return { label: l.value.trim(), amount: parseFloat(a.value) || 0, mode: m.value }; });
      const method = ($('input[name=s-pay]:checked') || {}).value || 'cash';
      const s = { rentDays: parseInt($('#s-days').value, 10) || 0, rate: parseFloat($('#s-rate').value) || 0, rateType: monthly ? 'month' : 'day', rentAmount: monthly ? (parseFloat($('#s-amt').value) || 0) : null, vatMode: vm, lines, fines: parseFloat($('#s-fines').value) || 0,
        advance: parseFloat($('#s-adv').value) || 0, method, ccPct: +((($('input[name=s-cc]:checked') || {}).value) || 0), notes: $('#s-notes').value.trim() };

        batch.update(db.doc('bookings/' + id), { status, updatedAt: FV.serverTimestamp(), updatedBy: S.me.name, log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text: status === 'closed' ? `Closed, total AED ${money(totals.total)}, paid by ${s.method}` : `Settlement saved, charges pending (AED ${money(totals.total)} so far)` }) });

    };
    $('#s-pending').onclick = e => save('pending', e.target);
    $('#s-close').onclick = e => save('closed', e.target);
  };
  return { title: 'Final bill (optional)', back: S.listHash || '#/booking/' + id, html, mount, form: true };
}

/* ========================================================= bookings list (bulk) */
async function loadList() {
  const F = S.filter;
  const s = await db.collection('bookings').where('deliveryDate', '>=', F.from).where('deliveryDate', '<=', F.to).get();
  S.listRows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, c) => a.deliveryAt.localeCompare(c.deliveryAt));
  S.listFin = await getFinMany(S.listRows.map(r => r.id));
}
function refCandidates(q) {

const MULTI_MAKES = ['range rover', 'land rover', 'mercedes benz', 'mercedes-benz', 'alfa romeo', 'aston martin', 'rolls royce', 'great wall'];

    let rows = lines.slice(hIdx + 1);
    const need = Math.max(C.plate, C.color, C.name, C.year, C.category);
    const incomplete = l => { const c = l.split('\t'); return c.length <= need || (c.length === need + 1 && !String(c[need]).trim()); };
    const g = [];
    rows.forEach(l => { if (!l.trim()) return; const last = g[g.length - 1]; if (last != null && incomplete(last)) g[g.length - 1] = last.endsWith('\t') ? last + l : last + '\t' + l; else g.push(l); });
    rows = g;
    rows.forEach((l, i) => {
      if (!l.trim()) return;
      const c = l.split('\t'), v = k => C[k] >= 0 ? String(c[C[k]] ?? '').trim() : '';
      const year = v('year').match(/\d{4}/) ? v('year').match(/\d{4}/)[0] : '';
      const nm = C.make >= 0 ? { make: tidyCase(v('make')), model: tidyCase(v('model')) } : splitName(v('name') || v('model'), year);
      const own = v('own').toLowerCase(), sub = /sub|external/.test(own);
      const d = { make: nm.make, model: nm.model, year, plate: v('plate'), color: tidyCase(v('color')), category: v('category'), type: sub ? 'sublease' : 'own',
        ownership: sub ? 'sublease' : /investor/.test(own) ? 'investor' : 'owned', active: !v('status') || /active/i.test(v('status')) && !/inactive/i.test(v('status')) };
      if (sub) d.supplier = v('supplier') || 'To confirm';
      const dOnly = x => { const t = impDate(x); return t ? t.slice(0, 10) : ''; };
      if (C.reg >= 0 && dOnly(c[C.reg])) d.regExpiry = dOnly(c[C.reg]);
      if (C.ins >= 0 && dOnly(c[C.ins])) d.insExpiry = dOnly(c[C.ins]);
      push(d, hIdx + 2 + i);
    });
  } else {
    const g = [];
    lines.forEach(l => { if (!l.trim()) return; const last = g[g.length - 1]; if (last != null && last.endsWith('\t') && !/^\s*\d{1,4}\t/.test(l)) g[g.length - 1] = last + l; else g.push(l); });
    g.forEach((raw, i) => {
      const line = raw.trim(); if (!line) return;
      let c = (line.includes('\t') ? raw.split('\t') : line.split(',')).map(x => x.trim());
      if (/^\d{1,4}$/.test(c[0]) && !/^(19|20)\d\d$/.test(c[0]) && c.length >= 4) c = c.slice(1);
      if (/^(make|model|s\.?\s*no)/i.test(c[0])) return;
      if (/^(19|20)\d{2}$/.test(c[1] || '')) {
        const [name = '', year = '', plate = '', category = '', own = '', color = '', status = ''] = c;
        const nm = splitName(name, year), o = own.toLowerCase(), sub = /sub|external/.test(o);
        const d = { make: nm.make, model: nm.model, year, plate, color: tidyCase(color), category, type: sub ? 'sublease' : 'own', ownership: sub ? 'sublease' : /investor/.test(o) ? 'investor' : 'owned', active: !status || /active/i.test(status) && !/inactive/i.test(status) };
        if (sub) d.supplier = 'To confirm';
        push(d, i + 1);
      } else {
        const [make = '', model = '', year = '', plate = '', color = '', category = ''] = c;
        push({ make: tidyCase(make), model: tidyCase(model), year, plate, color: tidyCase(color), category, type: 'own', ownership: 'owned', active: true }, i + 1);
      }
    });
  }
  return { ok: out, skipped };
}

function printHeader(title, sub) {
  const s = S.settings;
  const addr = [s.address, s.phone, s.trn ? 'TRN ' + s.trn : ''].filter(Boolean).join('   |   ');
  return `<header class="p-head"><div class="p-brand">${LOGO_URL ? `<img src="${esc(LOGO_URL)}" class="p-logo" alt="">` : `<div class="p-wm">${esc(BR.short)}</div>`}

    <div class="p-title"><h1>${esc(title)}</h1><div>${esc(sub || '')}</div></div></header>`;
}
const printFoot = () => `<div class="p-foot">Printed by ${esc(S.me.name)} on ${esc(fmtDT(nowLocal()))}, app v${APP_VERSION}</div>`;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF maker. Check the internet connection.')); document.head.appendChild(s); });
/* phones, tablets and home-screen apps block the print window, so there we build a real PDF file */
const useFilePdf = () => window.FORCE_FILE_PDF || matchMedia('(pointer: coarse)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function browserPrint(html, landscape) {
  $('#print').innerHTML = html;
  let ps = $('#pagestyle'); if (!ps) { ps = document.createElement('style'); ps.id = 'pagestyle'; document.head.appendChild(ps); }
  ps.textContent = `@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:12mm}`;
  const imgs = $$('#print img'); let n = imgs.length;
  const go = () => setTimeout(() => window.print(), 150);
  if (!n) return go();
  imgs.forEach(i => { if (i.complete) { if (--n === 0) go(); } else { i.onload = i.onerror = () => { if (--n === 0) go(); }; } });
}
async function doPrint(html, landscape, fileName) {
  const name = (fileName || BR.short).replace(/[^\w.-]+/g, '-') + '.pdf';
  if (!useFilePdf()) return browserPrint(html, landscape);
  openSheet(`<h2>Preparing PDF…</h2><p class="muted">${esc(name)}</p><div class="pdf-spin" aria-hidden="true"></div>`);
  let wrap;
  try {
    if (!window.html2pdf) { try { await loadScript(window.H2P_URL || 'html2pdf.bundle.min.js'); } catch (e) { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'); } }
    const sx = window.scrollX, sy = window.scrollY; window.scrollTo(0, 0);
    wrap = document.createElement('div');
    wrap.className = 'pdf-stage';
    wrap.style.width = (landscape ? 1062 : 733) + 'px';
    wrap.innerHTML = `<div class="pdf-doc">${html}</div>`;
    document.body.appendChild(wrap);
    await Promise.all([...wrap.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const blob = await window.html2pdf().set({
      margin: [8, 8, 8, 8], filename: name, image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, x: 0, y: 0, windowWidth: wrap.offsetWidth },
      jsPDF: { unit: 'mm', format: 'a4', orientation: landscape ? 'landscape' : 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.p-sign', '.p-kv'] }
    }).from(wrap.firstElementChild).outputPdf('blob');
    wrap.remove(); wrap = null; window.scrollTo(sx, sy);
    const file = new File([blob], name, { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    const o = openSheet(`<h2>PDF ready</h2><p class="muted" style="margin:4px 0 0">${esc(name)}, ${Math.max(1, Math.round(blob.size / 1024))} KB</p>
      <div class="btnrow">${canShare ? '<button class="btn primary" id="pdf-share">Share or save</button>' : ''}<a class="btn ${canShare ? '' : 'primary'}" id="pdf-open" href="${url}" target="_blank" rel="noopener">Open PDF</a><a class="btn" href="${url}" download="${esc(name)}">Download</a></div>
      <p class="small muted" style="margin:10px 0 0">${canShare ? 'Share or save sends it to WhatsApp, email, Files or Print.' : 'Open PDF shows it, and from there you can share or print it.'}</p>
      <div class="btnrow"><button class="btn" data-act="close">Close</button></div>`);
    const sh = o.querySelector('#pdf-share');
    if (sh) sh.onclick = async () => { try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e && e.name !== 'AbortError') toast('Sharing was blocked. Use Open PDF instead.'); } };
  } catch (e) {
    if (wrap) wrap.remove();
    closeSheet(); toast((e && e.message) || 'Could not make the PDF.'); console.error(e);
  }
}

/* ========================================================= import open agreements */
function splitTSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const IMP_COLS = { ref: /^agreement( no)?/, type: /^type$/, plate: /^vehicle( no| plate)?$/, customer: /^customer( name)?$/, phone: /^(contact|phone|mobile)/, driver: /^driver( name)?$/, nat: /nationality/, start: /^start/, end: /^end/, status: /^status$/, rate: /^rate$/, notes: /^additional notes$/ };
function mapHeader(row) {
  const m = {};
  row.forEach((h, i) => { const k = String(h ?? '').replace(/\s+/g, ' ').trim().toLowerCase(); for (const [key, re] of Object.entries(IMP_COLS)) if (m[key] == null && re.test(k)) m[key] = i; });
  return m;
}
function impDate(v) {
  if (v instanceof Date && !isNaN(v)) return localStr(new Date(v.getTime() + 30000));
  const s = String(v ?? '').replace(/\s+/g, ' ').trim();
  const m = s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})(?:\D+(\d{1,2}):(\d{2}))?/);
  if (!m) return '';
  let [, d, mo, y, h = '0', mi = '0'] = m; if (y.length === 2) y = '20' + y;
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return '';
  return `${y}-${pad(+mo)}-${pad(+d)}T${pad(+h)}:${pad(+mi)}`;
}
const plateSig = p => { const s = String(p || '').toUpperCase(); return { d: (s.match(/\d+/g) || []).join(''), l: (s.match(/[A-Z]+/g) || []).join('') }; };
function findCarByPlate(p) {
  const t = plateSig(p); if (!t.d) return null;
  let hit = S.cars.filter(c => { const x = plateSig(c.plate); return x.d === t.d && x.l === t.l; });
  if (hit.length === 1) return hit[0];
  hit = S.cars.filter(c => { const x = plateSig(c.plate); return x.d === t.d && (!x.l || !t.l); });
  return hit.length === 1 ? hit[0] : null;
}
function buildImport(table) {
  const hi = table.findIndex(r => { const m = mapHeader(r); return m.ref != null && m.plate != null && m.start != null; });
  if (hi < 0) return { error: 'Could not find the heading row. The pasted data needs the headings Agreement No, Vehicle and Start Date.' };
  const m = mapHeader(table[hi]), get = (r, k) => m[k] == null ? '' : r[m[k]];
  const items = [], seenPlates = new Map(); let notOpen = 0;
  table.slice(hi + 1).forEach(r => {
    const ref = String(get(r, 'ref') ?? '').trim();
    if (!ref || !/\d/.test(ref) || /sum/i.test(ref)) return;
    if (m.status != null && String(get(r, 'status')).trim() && !/open/i.test(String(get(r, 'status')))) { notOpen++; return; }
    const plate = String(get(r, 'plate') ?? '').replace(/\s+/g, ' ').replace(/-\s+/, '-').trim().toUpperCase();
    const rateRaw = String(get(r, 'rate') ?? '').replace(/,/g, '').replace(/\s+/g, ' ');
    const rm = rateRaw.match(/([\d.]+)\s*\/?\s*(month|day)?/i);
    const typeTxt = String(get(r, 'type') ?? '');
    const rateType = rm && rm[2] ? (/month/i.test(rm[2]) ? 'month' : 'day') : (/month/i.test(typeTxt) ? 'month' : 'day');
    const it = { ref, plate, customer: String(get(r, 'customer') ?? '').replace(/\s+/g, ' ').trim(), phone: String(get(r, 'phone') ?? '').split(/[,\/]/)[0].trim(),
      driver: String(get(r, 'driver') ?? '').replace(/\s+/g, ' ').trim(), nat: String(get(r, 'nat') ?? '').trim(), notes: String(get(r, 'notes') ?? '').trim(),
      start: impDate(get(r, 'start')), end: impDate(get(r, 'end')), rate: rm ? +(+rm[1]).toFixed(4) : 0, rateType, problems: [], warns: [] };
    if (!it.plate) it.problems.push('no vehicle plate');
    if (!it.customer) it.problems.push('no customer name');
    if (!it.start) it.problems.push('start date not readable');
    it.car = it.plate ? findCarByPlate(it.plate) : null;
    if (it.plate && !it.car) it.warns.push('plate not in your list, will be added as a sub-lease car');
    if (it.start) {
      if (!it.end) { it.endMissing = true; it.end = `${todayStr()}T${tOf(it.start)}`; it.warns.push('no end date, pickup set to today'); }
      if (it.end <= it.start) it.end = localStr(new Date(parseDT(it.start).getTime() + 864e5));
      if (parseDT(it.end) < new Date() && !it.endMissing) it.warns.push(`end date passed (${fmtDate(it.end)}), will show as overdue`);
      if (it.car) { const cf = conflicts(it.car.id, it.start, it.end); if (cf.length) it.warns.push(`overlaps ${cf.map(c => c.ref).join(', ')} for this car`); }
    }
    const pk = plateSig(it.plate).d + plateSig(it.plate).l;
    if (pk && seenPlates.has(pk)) it.warns.push(`same plate as agreement ${seenPlates.get(pk)} in this list`); else if (pk) seenPlates.set(pk, ref);

}
async function markDuplicates(items) {
  const refs = [...new Set(items.map(i => i.ref))];

  for (let i = 0; i < refs.length; i += 30) (await db.collection('bookings').where('oldRef', 'in', refs.slice(i, i + 30)).get()).docs.forEach(d => found.add(d.data().oldRef));
  items.forEach(i => { i.dup = found.has(i.ref); });
}

}

  toast(`${free.length} car${free.length === 1 ? '' : 's'} deleted${busy.length ? `, ${busy.length} kept because of bookings` : ''}.`);
  return true;
}

    $$('[data-rent]').forEach(x => x.addEventListener('change', () => { const l = catList().map(c => ({ ...c })); l[+x.dataset.rent].rent = x.checked; saveCats(l); }));
    const n = $('#cat-new'); n && n.addEventListener('keydown', e => { if (e.key === 'Enter') ACT['cat-add'](); });

  return { title: 'Car types (categories)', back: '#/more', html, mount };
}
async function saveCats(list, msg) { await db.doc('meta/settings').set({ categories: list }, { merge: true }); if (msg) toast(msg); }
ACT['cat-save-found'] = () => saveCats(catList().map(c => ({ ...c, rent: !/office/i.test(c.name) })), 'Categories saved.');
ACT['cat-add'] = async () => {
  const v = $('#cat-new').value.trim().replace(/\s+/g, ' ');
  if (!v) { $('#cat-err').textContent = 'Type a category name.'; return; }
  if (catInfo(v) && Array.isArray(S.settings.categories)) { $('#cat-err').textContent = 'That category already exists.'; return; }
  const l = catList().filter(c => c.name.toLowerCase() !== v.toLowerCase()); l.push({ name: v, rent: !/office/i.test(v) });
  await saveCats(l, `${v} added.`);
};
ACT['cat-move'] = ({ i, d }) => { const l = catList().map(c => ({ ...c })), a = +i, z = a + +d; if (z < 0 || z >= l.length) return; [l[a], l[z]] = [l[z], l[a]]; saveCats(l); };
ACT['cat-rename'] = async ({ i }) => {
  const l = catList().map(c => ({ ...c })), old = l[+i].name;
  const v = await ask({ title: `Rename ${old}`, text: 'All cars in this category are updated too.', ok: 'Rename', input: { label: 'New name', value: old, required: 'Type a name.' } });
  if (!v || v === old) return;
  if (l.some((c, k) => k !== +i && c.name.toLowerCase() === v.toLowerCase())) { toast('That category already exists.'); return; }
  l[+i].name = v;
  const cars = S.cars.filter(c => String(c.category || '').toLowerCase() === old.toLowerCase());
  for (let n = 0; n < cars.length; n += 400) { const b = db.batch(); cars.slice(n, n + 400).forEach(c => b.update(db.doc('cars/' + c.id), { category: v })); await b.commit(); }
  await saveCats(l, `Renamed to ${v}${cars.length ? `, ${cars.length} cars updated` : ''}.`);
};
ACT['cat-del'] = async ({ i }) => {
  const l = catList().map(c => ({ ...c })), c = l[+i];
  const n = S.cars.filter(x => String(x.category || '').toLowerCase() === c.name.toLowerCase()).length;
  if (n) { await ask({ title: `${c.name} is in use`, text: `${n} car${n === 1 ? ' uses' : 's use'} this category. Move ${n === 1 ? 'it' : 'them'} to another category first, or rename this one instead.`, ok: 'OK' }); return; }
  if (!(await ask({ title: `Delete ${c.name}?`, ok: 'Delete', danger: true }))) return;
  l.splice(+i, 1); await saveCats(l, `${c.name} deleted.`);
};

/* ---------- replace car during a rental ---------- */
ACT.replace = async ({ id }) => {

    <div class="grid2"><label class="f">Swap date<input type="date" id="r-date" value="${now.slice(0, 10)}"></label><label class="f">Swap time<input type="time" id="r-time" value="${tOf(now)}"></label></div>
    <label class="f">Type plate to find the car<input id="r-pq" autocomplete="off" autocapitalize="characters" placeholder="9185"></label>
    <label class="f">Replacement car<select id="r-car">${opts(now)}</select></label>
    <div id="r-hire" class="hire hidden"><h3>Sub-lease hire</h3>
      <label class="f">Supplier<input id="rh-sup" list="rh-sups" placeholder="Al Futtaim Rent A Car"><datalist id="rh-sups">${suppliers().map(s => `<option>${esc(s)}</option>`).join('')}</datalist></label>
      <div class="grid3"><label class="f">Make<input id="rh-make" placeholder="Nissan"></label><label class="f">Model<input id="rh-model" placeholder="Sunny"></label><label class="f">Year<input id="rh-year" inputmode="numeric" placeholder="2025"></label></div>
      <div class="grid2"><label class="f">Color<input id="rh-color" placeholder="White"></label><label class="f">Plate (if known)<input id="rh-plate" autocapitalize="characters" placeholder="TBC"></label></div></div>

    <div id="r-garbox">${garageFieldsHtml('rg')}</div>
    ${staff ? `<h3 class="sub-h">Rate</h3><div class="grid2"><label class="f">Rate from the swap (AED per ${f.rateType === 'month' ? 'month' : 'day'})<input id="r-rate" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(f.rate ?? '')}"></label><div class="small muted" style="align-self:end;padding-bottom:10px">Change only for an upgrade or downgrade. Now: ${esc(rateText(f))}</div></div>` : '<p class="small muted">Sales will update the rate if the replacement is an upgrade or downgrade.</p>'}

    <div class="btnrow"><button class="btn" data-act="close">Go back</button><button class="btn primary" id="r-save">Replace car</button></div>`);
  const sel = o.querySelector('#r-car');
  const swapAt = () => `${$('#r-date').value}T${$('#r-time').value || '00:00'}`;
  const sync = () => {
    o.querySelector('#r-hire').classList.toggle('hidden', sel.value !== '__hire');
    o.querySelector('#r-garbox').classList.toggle('hidden', !$('#r-gar').checked);
  };

  ['#r-date', '#r-time'].forEach(s => o.querySelector(s).onchange = () => { const v = sel.value; sel.innerHTML = opts(swapAt()); sel.value = v; sync(); });
  sel.onchange = sync; o.querySelector('#r-gar').onchange = sync; sync();
  o.querySelector('#r-pq').addEventListener('input', e => {
    const hits = plateMatches(e.target.value);
    [...sel.options].forEach(op => { if (!op.value || op.value === '__hire') return; op.hidden = !!e.target.value.trim() && !hits.some(h => h.id === op.value); });
    const ok = hits.filter(h => { const op = [...sel.options].find(x => x.value === h.id); return op && !op.disabled; });
    if (ok.length === 1) { sel.value = ok[0].id; sync(); }

  o.querySelector('#r-save').onclick = async ev => {
    const err = t => { $('#r-err').textContent = t; };

    if (!carSel) return err('Choose the replacement car.');
    if (at < (b.deliveredAt || b.deliveryAt)) return err('The swap can\'t be before the car was delivered.');
    if (at >= b.pickupAt) return err('The swap must be before the return date. Extend the rental first if needed.');
    const g = sendG ? garageRead('rg') : null;

        const d = { ...h, type: 'sublease', active: true, category: ex ? ex.category || '' : '' }; d.name = carTitle(d);
        if (ex) { batch.update(db.doc('cars/' + ex.id), d); car = { id: ex.id, ...d }; } else { const r = db.collection('cars').doc(); batch.set(r, d); car = { id: r.id, ...d }; }
      } else car = S.cars.find(c => c.id === carSel);
      const oldLeg = { carId: b.carId, plate: b.plate, carName: b.carName, carType: b.carType || 'own', supplier: b.supplier || '', from: b.legStart || b.deliveredAt || b.deliveryAt, to: at, reason,
        outHo: b.legOutHandover || b.deliveryHandover || null, inHo: { ...hoRead('ro'), notes: $('#ro-notes').value.trim() } };
      const text = `Car replaced (${reason}): ${b.plate} → ${car.plate}${g ? `, ${b.plate} sent to ${g.garage}` : ''}`;
      batch.update(db.doc('bookings/' + id), { carId: car.id, carName: carTitle(car), plate: car.plate, carType: isSub(car) ? 'sublease' : 'own', supplier: isSub(car) ? car.supplier || '' : '',
        legStart: at, legOutHandover: hoRead('rn'), legs: FV.arrayUnion(oldLeg), carIds: FV.arrayUnion(car.id, b.carId), updatedAt: FV.serverTimestamp(), updatedBy: S.me.name,
        log: FV.arrayUnion({ at: nowLocal(), by: S.me.name, text }) });
      if (staff && !isNaN(newRate) && newRate !== +f.rate) {
        batch.update(db.doc('finance/' + id), { rate: newRate, rateChanges: FV.arrayUnion({ at, from: +f.rate || 0, to: newRate, by: S.me.name }) });
      }
      if (g) { const no = await nextNo('GRG', true); batch.set(db.collection('garage').doc(), garageDoc({ carId: b.carId, plate: b.plate, carName: b.carName }, g, reason, at, no, { bookingRef: b.ref })); }
      await batch.commit();
      closeSheet(); toast(`${b.plate} replaced with ${car.plate}.${g ? ` ${b.plate} is now in the garage.` : ''}`);
      if (S.route === 'booking') backToList(); else render();
    } catch (e) { ev.target.disabled = false; err(friendlyError(e)); }
  };
};

}
async function loadGarageAll() { const s = await db.collection('garage').where('status', '==', 'closed').get(); S.garageAll = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.outAt.localeCompare(a.outAt)); }

  const match = g => !q.trim() || plateMatches(q).some(c => c.id === g.carId) || String(g.garage).toLowerCase().includes(q.toLowerCase()) || String(g.no).toLowerCase().includes(q.toLowerCase());

  const hist = (S.garageAll || []).filter(g => !isNrm(g)).filter(match);
  const cost = hist.reduce((s, g) => s + (+g.actualCost || 0), 0);
  const html = `<div class="toolbar"><button class="btn primary" data-act="garagein">Send a car to garage</button></div>
    <div class="seg left" role="group" aria-label="Show"><button class="${tab === 'in' ? 'on' : ''}" data-act="gartab" data-t="in">In garage ${moveCount('garage')}</button><button class="${tab === 'hist' ? 'on' : ''}" data-act="gartab" data-t="hist">History</button></div>

const RESET_SETS = [

async function backupAll() {
  const out = { app: `${BR.short} Booking`, version: APP_VERSION, exportedAt: nowLocal(), by: S.me.name, collections: {} };
  for (const c of ['bookings', 'finance', 'cars', 'garage', 'salespeople', 'users']) out.collections[c] = (await db.collection(c).get()).docs.map(d => ({ id: d.id, ...d.data() }));
  for (const m of ['settings', 'counter']) { const d = await db.doc('meta/' + m).get(); out[m] = d.exists ? d.data() : null; }
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' });
  const name = `${BR.short.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-backup-${todayStr()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (useFilePdf() && navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

}
function viewReset() {
  if (!isAdmin()) return deny();
  const html = `<section class="card danger-zone"><h2>Reset data</h2>

  <section class="card"><h2>2. Choose what to erase</h2>

    <p class="err" id="rs-err"></p><p class="small" id="rs-prog"></p>
    <div class="btnrow"><button class="btn danger" id="rs-go">Erase selected data</button></div></section>`;
  const mount = () => {
    $('#rs-bk').onclick = async ev => { ev.target.disabled = true; $('#rs-bkmsg').textContent = 'Preparing backup…'; try { const ok = await backupAll(); $('#rs-bkmsg').textContent = ok ? 'Backup saved. Keep this file safe.' : 'Backup cancelled.'; S.backupDone = ok; } catch (e) { $('#rs-bkmsg').textContent = friendlyError(e); } ev.target.disabled = false; };
    $$('.rs-opt input').forEach(x => x.addEventListener('change', () => { if (x.value === 'cars' && x.checked) { const e = $('.rs-opt input[value=external]'); e.checked = true; } }));
    $('#rs-go').onclick = async ev => {
      const err = t => { $('#rs-err').textContent = t; };
      const picked = $$('.rs-opt input:checked').map(x => x.value);
      if (!picked.length) return err('Tick at least one item to erase.');
      if ($('#rs-word').value.trim() !== 'RESET') return err('Type RESET in capitals to confirm.');
      let rpin = ''; try { const s = await db.doc('meta/secure').get(); rpin = s.exists ? String(s.data().resetPin || '') : ''; } catch (e) { }
      if (!rpin) return err('No Reset PIN is set yet. Set one under More, Company and VAT settings, PINs.');
      if ($('#rs-pin').value.trim() !== rpin) { $('#rs-pin').value = ''; return err('Wrong Reset PIN. Nothing was erased.'); }
      if (picked.includes('numbers') && !picked.includes('bookings')) return err('Restart numbering only together with resetting bookings, or numbers could repeat.');
      if (!S.backupDone && !(await ask({ title: 'No backup downloaded', text: 'You haven\'t downloaded a backup in this session. Erase anyway?', ok: 'Erase without backup', danger: true }))) return;
      ev.target.disabled = true;
      const prog = t => { $('#rs-prog').textContent = t; };
      try {
        const sets = RESET_SETS.filter(s => picked.includes(s.k));
        let total = 0;
        const delDocs = async refs => { for (let i = 0; i < refs.length; i += 400) { const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); total += Math.min(400, refs.length - i); prog(`Erased ${total} records…`); } };
        for (const s of sets) {

      } catch (e) { ev.target.disabled = false; err(friendlyError(e)); }
    };
  };

function alertItems() {

  for (const b of S.active.values()) {
    if (b.status === 'booked') { const ms = parseDT(b.deliveryAt) - now; if (ms < 0) items.push({ k: 'late', b, type: 'delivery', text: `Delivery late by ${durText(ms)}`, at: b.deliveryAt }); else if (ms <= 30 * 60000) items.push({ k: 'soon', b, type: 'delivery', text: `Delivery in ${durText(ms)}`, at: b.deliveryAt }); if (b.carTba && b.deliveryDate <= addDays(t, 1)) items.push({ k: 'car', b, text: 'Car not assigned yet', at: b.deliveryAt }); }
    if (b.status === 'onrent') { const ms = parseDT(b.pickupAt) - now; if (ms < 0) items.push({ k: 'late', b, type: 'pickup', text: `Pickup overdue ${durText(ms)}`, at: b.pickupAt }); else if (ms <= 30 * 60000) items.push({ k: 'soon', b, type: 'pickup', text: `Pickup in ${durText(ms)}`, at: b.pickupAt }); }

  return items.sort((a, c) => (a.k === 'late' ? 0 : 1) - (c.k === 'late' ? 0 : 1) || a.at.localeCompare(c.at));
}
